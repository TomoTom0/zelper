[package]
name = "zelper"
version = "0.1.0"
edition = "2024"
description = "Structured automation/orchestration CLI over Zellij"
license = "MIT OR Apache-2.0"
repository = "https://github.com/TomoTom0/zelper"
readme = "README.md"
authors = ["TomoTom0"]

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
kdl = "6"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[[test]]
name = "selector"
path = "tests/unit/selector.rs"

[[test]]
name = "parser"
path = "tests/unit/parser.rs"

[[test]]
name = "error_map"
path = "tests/unit/error_map.rs"

[[test]]
name = "cli_list_read_send"
path = "tests/cli/list_read_send.rs"

[[test]]
name = "cli_docs"
path = "tests/cli/docs.rs"

[[test]]
name = "fake_rename_add_remove"
path = "tests/fake_backend/rename_add_remove.rs"

[[test]]
name = "fake_resize"
path = "tests/fake_backend/resize.rs"

[[test]]
name = "fake_remap"
path = "tests/fake_backend/remap.rs"

[profile.release]
strip = true
