[[condition]]
id = "remap-cli.preflight-warning-paths-stderr-and-json"
source_lines = "tests/cli/remap.rs:530"
target_function = "remap preflight warningの伝達経路（normalize_tab_templates由来warnings）"
source = "docs/design/remap-v3-multi-tab-task75.md §2.4（複数のfocus=true鋳型がある場合は文書順最初を採用しwarningを出す。2026-09-16 E2E改修で明文化——zellijはdump上常にactive tabへfocus=trueを付けるため複数指定を機械的に判別できず、zelper側規則として文書順最初に確定し採用を利用者へ通知）・§3.7（preflight warningの伝達経路: human実行・--json実行・dry-runの全経路でstderrのwarning行へ出力〔--json実行時もstdoutのenvelope契約を壊さない〕。加えて機械可読経路としてdry-run/成功時のJSON dataへwarnings〔文字列列〕を格納） + docs/design/detailed-design.md DD-10.7 step 7 v2.2（複数focus=true鋳型は文書順最初を採用しwarning）・DD-10.10（warning伝達経路） + TASK-75設計書§5.2 (v)系列b"
description = "preflight warningの伝達経路（E2E vb退化の回帰固定・2026-09-16）: 複数のfocus=true鋳型（tab focus）を持つlayoutのremapでは、--json dry-run実行でも複数focus検出warningがstderrのwarning行へ出力され（stdoutのenvelope契約〔ok:trueの単一JSON〕を壊さない）、機械可読経路としてJSON data.warningsへ文字列列で載る。focus=true鋳型1件のlayoutではwarningなし・data.warningsは空。検出本体（文書順最初採用・warning 1件）はlayout-planner.normalize-tab-templates-doc-order-and-tab-attributesが管轄し、本条件は出力経路（stderr・JSON data）を管轄する"
given = "T=3（tab0とtab2がfocus=true・E2E focus-dual.kdl相当）のmulti-tab fixtureで remap --path <layout> --dry-run --json を実行した場合と、focus=true鋳型1件（tab0のみ）のMULTI_TAB_LAYOUTでの同一実行（対照）"
expect_return_shape = "前者はstderrにwarning:行（focus語を含む）が出力され・stdoutは単一のok:true envelopeでdata.warningsにfocus語を含む文字列が載る。後者はstderrにwarning行なし・data.warningsは空配列"

