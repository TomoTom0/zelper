source_lines = "tests/cli/remap.rs:171"
target_function = "version gate（zellij --version判定）"
source = "docs/testing/test-plan.md §2.7 (h) R46（zellij <0.44.3（0.44.2 / 0.43.1）→ UnsupportedVersion exit 4。実証済み0.44.x系列超過（0.45.0等）も同様） + docs/design/detailed-design.md DD-3.1（最小サポート0.44.3）・DD-3.5（compatibility policy）"
