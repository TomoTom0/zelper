[[condition]]
id = "remap-cli.r43-removed-flags-are-usage-error-exit2"
source_lines = "tests/cli/remap.rs:101"
target_function = "remap CLI parse（廃止option）"
source = "docs/testing/test-plan.md §2.7 (g) R43（--overflow nest / --overflow tabs / --session-scope はusage error（exit 2）。remap本体は実行されない） + docs/design/detailed-design.md DD-1.2/1.5・DD-10.2 #11・DD-12 + docs/design/design-review.md §4.8（TASK-43: 廃止optionの即時削除）"
description = "廃止optionの拒否: v0.1.xで削除済みの --overflow nest / --overflow tabs / --session-scope の指定はusage error（exit 2）でremap本体は実行されない。stdoutには何も出ず、usage errorはstderrへ出る"
given = "3-pane fixture（M=N=3・k=1）のfake zellij shimで、remap --inline <3-slot layout> に各廃止optionを付けて実行"
expect_return = "いずれもexit 2・stdout空・stderrにusage error"

[[condition]]
id = "remap-cli.r44-removed-flag-json-keeps-stdout-empty"
source_lines = "tests/cli/remap.rs:130"
target_function = "remap CLI parse（廃止option × --json）"
source = "docs/testing/test-plan.md §2.7 (g) R44（--json併用時もstdoutには何も出ない（usage errorはclap経由でstderrのみ。単一envelope契約を破るstdout出力は存在しない）） + docs/design/detailed-design.md DD-4・DD-12"
description = "廃止optionと--jsonの併用: usage errorはclap経由でstderrのみに出て、stdoutは空のまま（--json時でもerror envelopeではなくclap usage error。単一envelope契約を破るstdout出力は存在しない）"
given = "remap --inline <layout> --session-scope --json の実行"
expect_return = "exit 2・stdout空・stderrにusage error"

