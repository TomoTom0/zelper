# remap CLI契約（src/app/remap.rs: 廃止flag・version gate・dry-run出力）の検証条件。出典: test-plan §2.7 (g) R43〜R45・(h) R46・(i) R48〜R50出力側・DD-12・design-review §4.7/§4.8
