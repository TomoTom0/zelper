[[condition]]
id = "remap-cli.r49-dry-run-shows-kdl-preview-per-instance"
source_lines = "tests/cli/remap.rs:274"
target_function = "remap dry-run（生成KDL preview）"
source = "docs/testing/test-plan.md §2.7 (i) R49（生成KDL preview（instance毎。humanは [plan] block・--jsonは instances[].kdl）） + docs/design/detailed-design.md DD-10.10 (d)（TASK-74改訂: KDL previewはbare slot（shell pane）・template適用時はbar leaf出現） + docs/design/remap-v2-matching-fix-task74.md §2.4・§3（TR74-4直交fixtureのcli層配置: P-shell-proc slotはbare・P-cmd-pane slotはcommand注入） + 同§2.2 生成KDL例（boolean属性はquoteなし真偽値 borderless=true・数値属性 size=1 もquoteなし） + tmp/task74/acceptance/b_remap.json（TASK-74 E2E run3実測: quote付きboolean属性はzellij 0.44.3 layout parserに拒否される）"
description = "dry-runの生成KDL preview: --jsonは各instanceのkdl文字列をinstances[].kdlへ載せ、human形式は [plan] blockとして出す（CMR-5統合: json形式とhuman形式を1条件に統合）。TASK-74更新（fail-first: 旧実装〔pane_command注入〕ではP-shell-proc slotに前景processのcommandが乗る）: previewのKDLはTR74-4直交paneのslot形状を含み、P-shell-proc（terminal_command=null）のslotはbare（command属性なし）・P-cmd-pane（terminal_command=\"claude --model x\"）のslotはcommand=\"claude\" + args注入。default_tab_template付きlayoutではbar leaf（pane size=1 borderless=true { plugin ... }）が出現し、template無しlayoutでは出現しない。TASK-74再更新（2026-09-15 E2E run3・fail-first）: 生成KDLのboolean属性はquoteなしの真偽値形式（borderless=true）で出力されること——borderless=\"true\" のquote付き文字列形式はzellij 0.44.3 layout parserに「borderless should be either true or false, found \"true\"」として拒否される（実測: tmp/task74/acceptance/b_remap.json）。現行実装（run3 binary）はboolean属性をquote付き文字列化して出力するため本条件にfailする（test側期待値の追従は後段のtest更新作業）——（当時記録。実装・test追従で解消済み）。TASK-75（v2.2）: KDL previewは生成tab (b,t)毎へ一般化（T=1 fixtureではinstance=block相当のため期待値不変。multi-tab側はdry-run-reports-s-and-per-tab-slots）"
given = "TR74-4直交2 paneを含む4 pane / 2 tab fixtureで remap --inline <3-slot layout> --dry-run --json と --dry-run（human）の各実行、およびdefault_tab_template（children + compact-bar）付きlayoutでの --dry-run --json 実行"
expect_return_shape = "--jsonは2 instanceの各kdlが3-slotの生成KDL（paneの出現3回以上）で、P-shell-proc slotはbare・P-cmd-pane slotはcommand=\"claude\"を含む。template付きlayoutのkdlは plugin location=\"zellij:compact-bar\" を含み、bar leafのboolean属性はquoteなし真偽値（borderless=true）・数値属性 size=1 もquoteなし整数で出力される（borderless=\"true\" 等のquote付き文字列形式はzellij 0.44.3 layout parser拒否のため不可）。template無しlayoutは plugin location を含まない。humanはstdoutに [plan] blockを含む"

