id = "move.to-tab-poll-timeout"
source_lines = "tests/fake_backend/move.rs:784"
target_function = "move_::run_pane_to_tab（polling timeout）"
source = "tmp/tasks/tm-87/design_verb-extension.md §3.3（step3: pipe発行 + polling〔list-panes 250ms/10s〕・完了条件 = pane.tab_id == 宛先tab id / step4: polling timeout → OperationFailed〔権限hint付き・exit 5〕。いずれも移動済み/未移動の正確な報告〔pipeはCLI失敗後もserver側で遅延実行されうる旨の注意を含む。remap 10.7と同一文面規則〕）/§4.1 + §5.1"
description = "to-tab完了pollingのtimeout: break-id pipe送信後にpane.tab_idが宛先へ変わらない系列では、deadline（10s）超過でOperationFailedとして中断する。報告はremap DD-10.7と同一文面規則: 権限hint・pipe遅延実行の注意・移動済み/未移動の正確な報告を含む。REVIEW-3指摘2: timeout時に可能なら状態を再取得して報告し、確認できない系列を「未移動」と断定しない——未移動が観測されれば「still on tab」、移動は実際に完了しているがlenient観測だけ失敗する系列では「実際には完了したがdeadline内に確認できなかった」（pollのC3規則によりdeadline超過後の成立は成功扱いにしないためerrorのまま）"
given = "2 tab構成で (a) break-id pipe送信後にpane Aのtab_idが変わらない失敗注入（pipe効果不出現）と (b) 移動自体は反映されるがlist_panes_lenient応答からpaneが隠される観測失敗注入の各run_pane_to_tab"
expect_return = "(a)はErr（OperationFailed・exit 5）。messageに権限hint・遅延実行の注意・「the pane was not moved (still on tab N)」の正確な未移動報告を含む。(b)もErr（OperationFailed・exit 5）。messageに「actually completed … not observed within the polling deadline」の移動済み報告を含み、実状態のpaneは宛先tabへ移動済み"

[[condition]]
id = "move.swap-order-singleton-rule"
source_lines = "tests/fake_backend/move.rs:857"
target_function = "move_::run_pane_swap（pane交換の順序規則・singleton判定）"
source = "tmp/tasks/tm-87/design_verb-extension.md §3.3（pane交換の順序規則: AもBも当該tabの最後のselectable paneでない → A→T_B先〔決定論的tie-break〕/ Aのみ最後 → B→T_A先〔T_AはBの到着後もAが残るまで空にならない〕/ Bのみ最後 → A→T_B先〔対称〕。移動元tab自動close〔E6事実1〕の回避）/§5.1"
description = "pane交換2連発の順序規則: singleton判定（当該tabのselectable pane数==1基準）で発行順序を決め、どちらかのtabが一時的に空になって自動closeされる系列を構造的に回避する。両非singletonはA→T_Bが先（決定論的tie-break）、片方のみsingletonは非singleton側paneの移動が先（相手tab到着後の残存で空tabを防ぐ）"
given = "pane A∈T_A・pane B∈T_B（T_A≠T_B）の3構成: 両tab 2 pane以上（両非singleton）・T_AがAのみ（Aのみsingleton）・T_BがBのみ（Bのみsingleton）の各run_pane_swap(A, B)"
expect_return = "いずれもOk。break-idの発行順序が規則どおり（両非singletonはA→T_Bが先・AのみsingletonはB→T_Aが先・BのみsingletonはA→T_Bが先）で、両step完了後はA∈T_B・B∈T_A（pane id不変）"

