[[condition]]
id = "move.swap-partial-failure-report"
source_lines = "tests/fake_backend/move.rs:990"
target_function = "move_::run_pane_swap（途中失敗の部分状態報告）"
source = "tmp/tasks/tm-87/design_verb-extension.md §3.3（途中失敗時: 1step目成功・2step目失敗なら「A moved to T_B; B remains in T_B。完了は zelper move pane B --to-tab T_A」を正確に報告。atomicityは主張しない〔DD-12準拠〕）/§5.1 + §9 R4"
description = "pane交換2連発の途中失敗報告: 2 step目（B→T_A）が失敗する系列では、1 step目の実行済み（A moved to T_B）と2 step目の状態を正確に区別して報告し、手動完了hint（move pane B --to-tab T_A）を含む。2 step目の完了状態はREVIEW-3指摘2により再取得して報告（未移動が観測されれば「was not moved and remains on tab N」。pipe errorでは完了不能を明示）。atomicityの主張・黙示をしない（2 pipe間失敗は起こりうる。R4）"
given = "順序規則によりA→T_Bが先となる構成で、2 step目（B→T_A）のbreak-id pipeが完了しない失敗注入をしたrun_pane_swap"
expect_return = "Err（ErrorClass=OperationFailed・exit 5）。messageに移動済み（A・T_B所属）と未移動（B・元tab所属）の区別と手動完了hintを含む"

[[condition]]
id = "move.tab-swap-argv-sequence"
source_lines = "tests/fake_backend/move.rs:1026"
target_function = "move_::run_tab_swap / ZellijBackend::move_tab（argv: move-tab <left|right> -t <tab_id>）"
source = "tmp/tasks/tm-87/design_verb-extension.md §2.3（move_tab: TabMoveDirection〔Left/Right〕・argv = move-tab <left|right> -t <tab_id>。M2実測確定: direction positional必須・-tが存在し非active tabをfocus不変で1 position移動・go-to併用・focus復帰・step毎focus追跡は不要）/§2.4（run_tab_swap: 2 tab解決→position取得〔i<j・d=j-i〕→隣接transposition合成: A〔左側tab〕をright×d・相手側をleft×(d-1)の計2d-1回のmove-tab -t呼び出しで純position交換〔各呼び出しはedgeを越えないためwrap不発火・d=1はright×1の1回〕→id基準で追跡しstep毎にlist-tabsで存在確認→postcondition〔position交換・id/name不変をlist-tabsのid追跡で検証〕）/§5.1 + TASK-88 body【M2】 + tmp/tasks/tm-88/m2_result.log（move-tab left --tab-id 3: 非active tab移動・active維持・CHECK[m2-id-name] PASS）・m2b_result.log（隣接1回: A0B1→B0A1の純swap・最後尾rightはwrap全体rotation〔直接反復では純swap不可の観測根拠〕）"
description = "tab交換の隣接transposition合成: 左側tab A（position i）をright×d・相手B（position j>i）をleft×(d-1)の計2d-1回のmove_tab呼び出しで純position交換を実現する（M2実測「隣接は1回で純swap」からの導出。各呼び出しは1 position移動のためedge wrap〔全体rotation〕は不発火）。d=1（隣接）はright×1の1回。step毎にlist-tabsでid存在確認（id基準追跡）。-tがfocus不変のためgo-to-tab併用・focus復帰は行わない（M2確定）。postcondition: 両tabのposition交換・tab id/name不変"
given = "4 tab構成（position 0..3）でのrun_tab_swap(A=position 0, B=position 2)〔d=2〕と隣接構成run_tab_swap(A=position 0, B=position 1)〔d=1〕の各実行"
expect_return = "Ok。move_tab呼び出しはd=2系でTabMoveDirection::Right×2（A）→ Left×1（B）の計3回（argv: move-tab right -t <A_id> / move-tab left -t <B_id>）、d=1系はRight×1の1回のみ。完了後のpositionは交換（d=2系: A=2・B=0）で、tab id/nameは不変。go-to-tab呼出は0回"

