[[condition]]
id = "move.swap-both-singleton-preflight-error"
source_lines = "tests/fake_backend/move.rs:961"
target_function = "move_::run_pane_swap（両singleton tabの拒否）"
source = "tmp/tasks/tm-87/design_verb-extension.md §3.3（両方最後〔両singleton tab〕→ Preflight error exit 7。「どちらのtabも閉じて再作成が必要になりtab位置・idを保存できない。move tab --swap-with（tab交換。pane内容の位置関係は入れ替わるが、tab名・tab idの帰属は入れ替わらない点がpane交換と異なる）かremapを使うこと」をhint）/§9 R7/§5.1 + TASK-88 body【確定事実の前提: 順序規則では自動close回避不能】"
description = "両singleton tabのpane交換拒否: どちらかのpane移動で必ず移動元tabが空になり自動closeされるため（順序規則で回避不能）、実行前にPreflight errorで中断する。hintは代替手段（move tab --swap-with・remap）と、tab交換ではtab名・tab idの帰属が入れ替わらない旨の差分案内を含む（R7）"
given = "AがT_A唯一のselectable pane・BがT_B唯一のselectable pane（両singleton）の構成に対するrun_pane_swap(A, B)"
