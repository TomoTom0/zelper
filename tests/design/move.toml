given = "M1実測の実配置（左 A=terminal_0 (y=0,x=0,29x50) focus・右上 B=terminal_1 (0,50,15x50)・右下 C=terminal_2 (15,50,14x50)）のFakeBackendに対する CASE L（terminal_2 Left）/ CASE R（terminal_0 Right）/ CASE U（terminal_2 Up）/ CASE D（terminal_1 Down）の各run_pane_native"
expect_return = "いずれもOk。argvはmove-pane <dir> -p <spec>がちょうど1回。CASE L/RではA(0)とC(2)が交換（Rの相手は右上Bでない）・CASE U/DではB(1)とC(2)が交換でA不変。全paneの幾何・ID・titleが不変でfocusはM1実測則どおり（L: 移動pane 2へ・U/D: Aのまま）"

