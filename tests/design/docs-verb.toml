target_function = "docs::run（DocsTarget::Readme）"
source = "docs/design/design-review.md §4.4 TASK-24（agent配布物のdocs verb・実装と配布物の一致をCLI契約テストで検証） + docs/design/detailed-design.md DD-1.1（docs = agent向け配布物の出力。zellij sessionに触れない純粋出力の文書化された例外コマンド）"
description = "zelper docs readmeはrepo正本README.mdをそのままstdoutへ出力する。配布物取り出し経路として出力が正本と一致すること（byte一致）の保証"
given = "zelper docs readmeの実行"
expect_return_shape = "exit 0かつstdoutがrepo README.mdと完全一致"

