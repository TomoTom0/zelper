given = "FakeBackendへfail_list_sessions_after_delete()（delete-session呼出を1回観測した後のlist_sessions呼出のみ失敗注入。事前確認は成功）した状態でのrun_session(Names=[fake], yes=true) の実行。classは既定のOperationFailedとinject_failure_asによるZellijUnavailableの2種"
expect_return = "いずれもErr。classは注入と同一の保持（OperationFailedならexit 5・ZellijUnavailableならexit 4）。messageはbut failed to confirmとinjected failureを含む。callsにdelete-session呼出あり（実行済み）"

