note = "TASK-84実装工程で全条件緑化・検証記録を再設定（設計: tmp/tasks/tm-84/design_remove-session.md改訂版）。kill/delete意味論は単一（完全削除・zellij 0.44.3実測M4〜M8でkill-sessionもdataを消すためsplitなし）でbackend操作はdelete-session <NAME> -fに統一。src/zellij/process.rs（delete_session trait実装。trait定義はsrc/zellij/mod.rs）・src/cli.rs（RemoveTarget::Session・clap pairwise conflicts + app層exactly-one）・src/main.rs（RemoveTarget::Session例外dispatch・probe backend）も検証対象。CLI parse文法・help出現はcli-grammar.tomlが分担。fake.rsのsession状態管理拡張〔delete_sessionでsessionsから行削除・mute_delete_session / fail_list_sessions_after_delete注入〕も参照。L3 2件のtest側誤記を実装契約へ合流修正（dispatch-via-probe-backendのFAKE_LOG記録形式 `list-sessions -n`〔backend list_sessionsの確定argv〕・me-requires-envの--json付け漏れ——設計DD-3.1/DD-4.2とtest期待の誤解釈解消）"

[[condition]]
