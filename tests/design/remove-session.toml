expect_return = "(i)〜(v) はいずれもexit 2（Usage）。(vi) はexit 2にならず実行経路へ進む（exit 0）。FAKE_LOGにdelete-session呼出なし（(vi)の対照正例以外。違反構成では状態変更前に拒否される）"

