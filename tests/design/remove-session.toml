# 出典: TASK-84設計書 tmp/tasks/tm-84/design_remove-session.md（§2.0 grammar〔NAME.../--all/--dead/--me 4 selector排他〕・§2.1 delete-session -f統一・§2.2 all/dead flag・§2.3 --me selectorとself保護〔user決定2026-11-13〕・§2.4 EXITED受理・§2.5 常時gate・§2.6 dry-run plan・§2.7 backend/dispatch・§2.9 error/exit表・§2.11 postcondition・§2.12 部分失敗・§3 実測根拠・§5 実測記録M1〜M8）
# 対応test（TASK-84テスト先行作成・実装前fail-first。1条件=1 test fnの1:1対応）:
#   L2 5条件 = tests/fake_backend/remove_session.rs（fake_remove_session。gate常時化・postcondition 2系・NAME重複除去・EXITED受理）
#   L3 16条件 = tests/cli/list_read_send.rs（cli_list_read_send。shimのFAKE_SESSIONS〔EXITED行混在可〕・FAKE_SESSIONS_EMPTY〔0-session環境〕・FAKE_FAIL_DELETE_SESSION / FAKE_MUTE_DELETE_SESSION〔delete-session応答制御〕・${FAKE_LOG}.deleted〔delete-session作用のlist-sessions応答反映〕・ZELLIJ_SESSION_NAME env制御）
