[[condition]]
id = "remove-session.me-preflight-warning-before-execution"
source_lines = "tests/cli/list_read_send.rs:3317"
target_function = "remove::run_session（--me実行前のstderr warning）"
source = "tmp/tasks/tm-84/design_remove-session.md §2.3（自壊時の報告契約〔best-effort〕: --me実行ではdelete-sessionの効果としてzelper自身が巻き込まれ、報告・exit status・postcondition検証が実行されない可能性がある。実装は通常経路と同一code pathとし検証・報告を意図的にskipする特殊分岐は作らない。kill後の出力は失われるため、実行前にstderrへ警告行を出力する〔唯一確実な通知経路〕: warning: removing the current session 'X'; zelper may be terminated before reporting）"
description = "--me実行前の警告行: 自session削除はzelper自身のprocess treeを巻き込みうるため、delete-session呼出の前にstderrへ警告行（removing the current session + 実行されない可能性の旨）を出力する。実行自体は通常経路（検証・報告の意図的skipなし）で、fake backend環境では通常の成功経路としてremoved報告まで完結する。警告行が削除開始より前であることはshimのdelete handler開始marker（親zellerのstderrへ直接出力）との順序比較で検証する"
given = "fake zellij shim（FAKE_SESSIONS=fake-sess稼働・delete-session handlerは開始markerをzeller stderrへ出力）でZELLIJ_SESSION_NAME=fake-sessを設定した環境での zelper remove session --me --yes の実行"
expect_return = "exit 0。stderrにwarning行（removing the current sessionを含む）が出る。FAKE_LOGに `delete-session fake-sess -f` あり。stdoutには通常の成功報告（removed session 'fake-sess' (current session)）がある（fake backendでは自壊しないため通常経路の検証も含む）"

