source_lines = "tests/cli/list_read_send.rs:2939"
target_function = "remove::run_session（app層exactly-one検証）+ cli.rs RemoveTarget::Session（clap pairwise conflicts）"
source = "tmp/tasks/tm-84/design_remove-session.md §2.0（対象selectorは NAME...（1件以上）/ --all / --dead / --me の4者のうちちょうど1つ。DD-1.5排他規則に追加。違反はusage error exit 2。clapのpairwise conflicts + app層のexactly-one検証——moveの三者排他と同一pattern）・§2.9表（selector不在/併用違反 Usage 2）"
description = "remove sessionの4 selector排他: NAME...（1件以上）・--all・--dead・--meは相互排他かつちょうど1つ必須。0個（全selector不在）と2個以上の同時指定はusage error（exit 2）で状態変更前に拒否する。clap pairwise conflicts（parse段の併用拒否）とapp層のexactly-one検証（0個拒否・clapで表現できない組合せの最終検証）の二段構えで、単一の検証だけで素通りさせない"
