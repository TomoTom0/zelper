description = "multi-tab割当の累積slot式: source visual orderのpane index iはblock b=floor(i/S)・block内offset o=i%Sへ写像され、累積slot数C_tについてo in [C_t, C_t+N_t)を満たすtab t・slot s=o-C_tへ割当てられる（visual order逐次充填）。生成tabは全block全tab（k×T）で(b,t)=(0,0)のみanchor。決定論保証範囲(i)（group=block×tab所属はvisual orderから決定論的）の本体。fail-first: 現行実装は単一鋳型（T=1）の割当しか行わない"
given = "ref-hetero相当のmulti-tab layout（T=3・N_t=9,1,2・S=12）の正規形TabTemplate列と、visual順15 pane（M=15 → k=2）をplan_v2へ与える"
expect_return = "k=2・blocks長2・各blockのgroups長3。pane i=0..8はgroup (0,0)のslot 0..8・i=9は(0,1)のslot 0・i=10,11は(0,2)のslot 0,1・i=12,13,14は(1,0)のslot 0,1,2・(1,1)/(1,2)は割当0件。割当は入力並び順に依存せずvisual orderで固定（r10規則のmulti-tab拡張）"

