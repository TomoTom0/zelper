description = "T=1式レベル後方互換の回帰固定: T=1（単tab layout・tab無しlayout・--inline）ではS=N_0=Nであり、割当式b=floor(i/N)・s=i%N、k=max(1,ceil(M/N))、命名は幹=baseで(0,0)=anchor・b>=1は<base>-<b+1>、tab focus復帰先はfocus=true鋳型が(0,0)=anchorを指すため無指定時と同一のanchor——計画レベル（割当式・k式・命名・tab focus復帰先）がv2.1と厳密一致する。既存r1〜r7・r39系がT=1 fixtureで期待値不変のままこの一致を固定する。保証範囲外（TR75-3明記）: 実行操作列全体の一致ではなく、focus-pane-id呼出はT=1でも新たに実行される（remap-sequence.focus-pane-id-after-override-per-tab。破壊的変更としてCHANGELOGへ記載予定）"
