source = "docs/design/remap-v3-multi-tab-task75.md §2.1・§3.1（正規形TabTemplate列: layoutの各tab nodeを文書順に列挙し各tabの鋳型〔subtree・name・focus・n_slots・pane_focus_slot〕を構築。name/focusはtab nodeの属性でsubtree本体からは除去。template無しlayoutはtab subtreeをそのまま。tab無しlayoutは1つの名無しtab鋳型T=1。new_tab_template・pane_template/tab_templateはSKIP_NODES維持） + docs/design/detailed-design.md DD-10.6 v2.2（正規形TabTemplate列） + docs/design/first/260821/requirements.md §2.6（multi-tab layout全体再現・tab名・tab focus属性）"
description = "正規形TabTemplate列構築の本体: layoutの各tab nodeを文書順に列挙し、各tabの鋳型を構築する。tab属性（name・focus）はsubtree本体から除去して鋳型fieldへ保持する。template無しlayoutではtab subtreeをそのまま用い、default_tab_template付きlayoutではchildren置換済みsubtree（置換判定の本体はlayout-generator.template-children-substitution。v2.2一元化によりgeneratorはtemplate引数を持たない）。tab nodeが1つもないlayout（--inline・tab無しfile layout）は1つの名無し鋳型（T=1・旧base_subtree相当）。new_tab_template・pane_template/tab_templateはSKIP_NODES維持で鋳型化対象外。E2E vb改修（2026-09-16）追記: 複数のfocus=true鋳型（tab focus）がある場合は文書順最初の採用とともにwarning 1件を返す（§2.4・§5.2系列b。出力経路はremap-cli.preflight-warning-paths-stderr-and-jsonが管轄）"
given = "tab name・focus属性付き2-tab layout（各tab subtreeにbare pane 2つ）・tab無しlayout（layout直下にpane 3つ）・new_tab_template混在tab layoutをnormalize_tab_templatesへ与える場合、focus=true鋳型1件の2-tab layoutの場合、tab0とtab2の両方がfocus=trueの3-tab layout（E2E focus-dual.kdl相当）の場合"
expect_return = "第1はT=2・鋳型0はname=Some(\"T-a\")・focus=true・n_slots=2、鋳型1はname=None・focus=false・n_slots=2、各subtreeにtab属性（name/focus）は残存しない。第2はT=1・name=None・focus=false・n_slots=3。第3はnew_tab_templateを鋳型に含めない（Tはtab node数のみ）。focus=true鋳型1件はwarningなし・複数focus=true鋳型はwarning 1件（focus語を含む）"

[[condition]]
