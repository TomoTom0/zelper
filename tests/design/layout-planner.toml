source_lines = "tests/unit/layout_planner.rs:431"
target_function = "plan_v2（V2Assignment.run算出）"
source = "docs/design/remap-v2-matching-fix-task74.md §2.1（照合keyをterminal_command〔invoked_with序列化〕へ変更。pane_command〔前景process〕は参照しない） + docs/design/detailed-design.md DD-10.8（occupied slot: terminal_commandを注入。command = 空白分割のargv[0]、args = 残り。cwdは注入しない。terminal_command = None はbare pane slotのまま）・DD-10.1 事実5（F1/F2/F3: terminal_command = invoked_with序列化・pane_command = PTY前景process・bare起動paneはinvoked_with=None）"
description = "run算出のdata source（TASK-74主因A修正の核）: V2Assignment.runはpane.terminal_command基準で算出する。terminal_command=None（bare・既定shell起動pane）→run=None（生成KDLはbare slotのまま。pane_command〔前景process〕の値は参照しない）・terminal_command=Some(s)→run=Some(s.split_whitespace())（command=argv[0]・args=残り・cwdは注入しない）。TR74-4直交2 paneを含み、旧実装（pane_command依存のrun算出）が必ずFAILするfail-first条件: P-shell-proc（terminal_command=None+pane_command=Some）は旧実装ではcommand注入されるが新実装ではrun=None／P-cmd-pane（terminal_command=Some+pane_command欠損）は旧実装ではrun=None（bare化）だが新実装ではrun=Some(argv)"
given = "P-shell-proc（terminal_command=None・pane_command=Some(\"vim src/main.rs\")）・P-cmd-pane（terminal_command=Some(\"claude --model x\")・pane_command=None）・通常pane（両方None）の3 paneと正規形TabTemplate列（T=1・N_0=3）・anchor tab 0をplan_v2へ与える"
expect_return = "k=1・P-shell-procのrun=None・P-cmd-paneのrun=Some([\"claude\", \"--model\", \"x\"])・通常paneのrun=None。pane_commandの値（vim src/main.rs）はrunに一切反映されない"

