id = "cli-grammar.move-native-argv-and-noop-warning"
source_lines = "tests/cli/list_read_send.rs:1563"
target_function = "move pane nativeのCLI表面（argv・exit 0・no-op warning・JSON envelope）"
source = "tmp/tasks/tm-87/design_verb-extension.md §2.1（cli enum→domain写像はresize armと同一pattern）/§2.3（move_pane: argv = move-pane <dir> -p <spec> / move-pane-backwards -p <spec>）/§2.4（run_pane_native: 幾何再取得比較でno-op warning・exit 0。resizeのno-op報告規約に準拠）/§4.2/§4.3（JSON data・1行サマリ・no-opはwarning行）+ §5.3（FAKE_LOG全argv記録でmoveのargv列を担保）"
description = "move pane nativeのCLI表面: `move pane 1 left`は`--session NAME action move-pane left -p terminal_1`を発行してexit 0する。fake shimはpane状態を変えないため幾何比較はno-op判定となり、M1実測のedge silent no-op契約（rc=0でも幾何不変ならwarning報告・exit 0・JSON data.noop=true）がCLI表面で検証される。rotate --backwardsは`move-pane-backwards -p <spec>` argvになる"
