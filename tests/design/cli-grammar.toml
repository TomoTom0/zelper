[[condition]]
id = "cli-grammar.move-three-way-exclusive-usage-error"
source_lines = "tests/cli/list_read_send.rs:1880"
target_function = "move pane構文（action positional / --to-tab / --swap-with の三者排他・--backwards×rotate制約）"
source = "tmp/tasks/tm-87/design_verb-extension.md §1.2（MovePaneAction positional / --to-tab / --swap-with は三者相互排他かつちょうど1つ必須。違反はusage error exit 2。clap conflicts + code levelのexactly one検証・--backwardsはaction=rotateとのみ併用可〔runtime検証〕）/§1.5（DD-1.5排他規則追記）/§5.1（cli-grammar.toml: 新verb構文・排他の条件を追加）"
description = "move paneの三者排他と--backwards制約のCLI parse表面: action positional・--to-tab・--swap-withは相互排他かつちょうど1つ必須（0個・2個同時・--backwards単独〔clap requires〕・--backwards+方向指定〔app層runtime検証〕はいずれもusage error exit 2）。L2（move.exclusive-usage）がrun層の同一規則を条件化するのに対し本条件はclap parse・CLI実行の表面を担う"
given = "zelper move pane 1（3指定とも不在）・move pane 1 left --to-tab 0（action+--to-tab同時）・move pane 1 --to-tab 0 --swap-with 2（option同時）・move pane 1 --backwards（action不在）・move pane 1 left --backwards（rotate以外との併用）の各実行"
expect_return = "いずれもexit 2（usage error）。--backwards+方向指定は文面に--backwards起因の案内を含む。move-pane系argvは不発"

[[condition]]
id = "cli-grammar.move-native-argv-and-noop-warning"
source_lines = "tests/cli/list_read_send.rs:1924"
target_function = "move pane nativeのCLI表面（argv・exit 0・no-op warning・JSON envelope）"
source = "tmp/tasks/tm-87/design_verb-extension.md §2.1（cli enum→domain写像はresize armと同一pattern）/§2.3（move_pane: argv = move-pane <dir> -p <spec> / move-pane-backwards -p <spec>）/§2.4（run_pane_native: 幾何再取得比較でno-op warning・exit 0。resizeのno-op報告規約に準拠）/§4.2/§4.3（JSON data・1行サマリ・no-opはwarning行）+ §5.3（FAKE_LOG全argv記録でmoveのargv列を担保）"
description = "move pane nativeのCLI表面: `move pane 1 left`は`--session NAME action move-pane left -p terminal_1`を発行してexit 0する。fake shimはpane状態を変えないため幾何比較はno-op判定となり、M1実測のedge silent no-op契約（rc=0でも幾何不変ならwarning報告・exit 0・JSON data.noop=true）がCLI表面で検証される。rotate --backwardsは`move-pane-backwards -p <spec>` argvになる"
given = "fake zellij shim（pane状態不変）に対する zelper move pane 1 left --json と zelper move pane 1 rotate --backwards の実行"
expect_return = "両方exit 0。前者はFAKE_LOGに`action move-pane left -p terminal_1`・stderrにno-op warning行・stdoutのJSON envelope data（target/action/noop=true）。後者はFAKE_LOGに`action move-pane-backwards -p terminal_1`"

[[condition]]
id = "cli-grammar.move-failure-exit5-operation-failed"
source_lines = "tests/cli/list_read_send.rs:1969"
target_function = "move系backend失敗のexit分類（FAKE_FAIL_MOVE_PANE / FAKE_FAIL_MOVE_TAB）"
source = "tmp/tasks/tm-87/design_verb-extension.md §4.1（move pane native: zellij非zero → OperationFailed 5 / move tab swap: move-tab呼出失敗 → OperationFailed 5）/§5.3（L3 shim拡張: FAKE_FAIL_MOVE_PANE / FAKE_FAIL_MOVE_TAB: 該当action非zero exit）"
