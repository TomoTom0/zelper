[[condition]]
id = "cli-grammar.session-flag-missing-name-notarget"
source_lines = "tests/cli/list_read_send.rs:2337"
target_function = "session解決（resolve_session: --session不在名の事前存在確認）"
source = "tmp/tasks/tm-93/design_session-zero-missing.md D3（TASK-93設計書: flag分岐でEXITED含む一覧へ照合し、不在名はNoTarget。runningありはcandidates・runningなしは作成案内。EXITEDは「存在」扱いでresurrection経路を保護） + 実測TASK-92: tmp/tasks/tm-92/verify_session-resolution.log（不在名はzellij生errorのOperationFailed exit 5で文面不統一だった従来挙動）"
description = "--session不在名の事前存在確認: 照合はlist_sessionsの構造化結果（name比較）であってstderr文面ではない（R1適合）。稼働ありならNoTarget（exit 3）+ candidates（running名一覧）でaction argv不発。完全0-session環境なら作成案内文面（candidatesなし）。EXITED名明示は「存在」扱いで解決を通過し後続action argvが発行される（attachによるresurrectionの正規経路の回帰保護）。fail-first: 現行実装は--session明示時に存在確認なくpass-throughするため(i)(ii)は赤（(iii)は現行も通過する回帰検出側）"
given = "(i) FAKE_SESSIONS=live-a（current）とlive-bの稼働2件+EXITED 1件（dead-x）混在でzelper --session ghost read 1 --json（EXITEDはcandidatesから除外） (ii) FAKE_SESSIONS_EMPTY=1（完全0-session環境）でzelper --session ghost read 1 (iii) FAKE_SESSIONS=dead-a（EXITEDのみ）でzelper --session dead-a read 1"
expect_return = "(i) exit 3（NoTarget）・JSON error.candidates == [live-a, live-b]・messageはsession 'ghost' not foundを含み、FAKE_LOGに--session ghost action argvなし (ii) exit 3（NoTarget）・stderrがsession 'ghost' not foundとno running zellij sessionsとcreate one with 'zelper add session ghost'を含む (iii) exit 0・FAKE_LOGに--session dead-a action dump-screen -p terminal_1（解決通過）"

