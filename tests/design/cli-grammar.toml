[[condition]]
id = "cli-grammar.move-tab-swap-argv-sequence"
source_lines = "tests/cli/list_read_send.rs:1994"
target_function = "move tab --swap-with のCLI表面（2d-1回の隣接transposition合成・postcondition通過）"
source = "tmp/tasks/tm-87/design_verb-extension.md §2.4（run_tab_swap: 隣接transposition合成——A〔左側tab〕をright×d・相手側をleft×(d-1)の計2d-1回。d=1はright×1の1回。-tがfocus不変のためgo-to-tab併用不要〔M2確定〕。postcondition: position交換・id/name不変）/§5.3（FAKE_LOG全argv記録でargv列を担保）"
description = "tab交換のCLI表面: 4-tab構成での`move tab 0 --swap-with 2`（d=2）は`move-tab right -t 0`×2 + `move-tab left -t 2`×1の計3回を発行（go-to-tab不使用）し、shimのtab順序状態管理によりpostconditionのposition交換検証を通過してexit 0する（JSON data.action=swap-tab・交換後position）。REVIEW-3指摘4: setup_fake_zellijがshimのtabs状態file（${FAKE_LOG}.tabs）を初期化するため、同一dir（tag+PID再利用を模したsetup再実行）でも初期状態から同一argv列・同一結果になることを併せて検証する"
given = "FAKE_TABS_JSON（4 tab・shimがmove-tabでposition移動をlist-tabs応答へ反映）での zelper move tab 0 --swap-with 2 --json の実行（引き続き同一dirでsetup再実行後に再実行）"
expect_return = "exit 0。FAKE_LOGのmove-tab argv列は〔move-tab right -t 0, move-tab right -t 0, move-tab left -t 2〕の順・go-to-tab呼出0回・JSON data.tabsは交換後position（id 0→2・id 2→0）。再実行も同一argv列・同一position（前回の交換後状態が残留しない）"

