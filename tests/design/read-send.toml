[[condition]]
id = "read-send.read-tail-applies-to-last-n-lines"
source_lines = "tests/cli/list_read_send.rs:553"
target_function = "read::run（apply_tail）"
source = "docs/testing/test-plan.md §2.4（read: --tail Nの加工） + docs/design/detailed-design.md DD-6（request: --tail N（行末N行、zelper側加工。--tailは取得済み内容——viewport、--full指定時はscrollback込み——の末尾N行に適用） + JSON: results[]: { target, title, tab, content | error }。--tailはcontentに適用） + apply_tail経路は実装済みのため、--tail N加工はtest追加により担保"
description = "--tail Nのzelper側加工: 取得済みcontentを末尾N行へ切り詰め、JSON resultsのcontent（detail）へ格納する。適用対象は取得形態の末尾N行（viewport / --full併用時はscrollback込み）で、両形式を1条件で検証（CMR-5: --tail単体と--full併用の2形式を統合。DD-6 request節が1文で両者を規定）。Nが行数以上の場合は切り詰められず全行保持の境界を含む。加工は出力前のapply_tail単一経路のためhuman出力にも同一の加工済み内容が現れる（検証はJSONで実施）"
given = "fake zellij shimのdump-screen応答を環境変数で複数行内容（例: 識別可能な5行）へ差し替えられるようにした上で、zelper read 1 --tail 2 --json・zelper read 1 --full --tail 2 --json・zelper read 1 --tail 99 --json（N >= 行数）の各実行"
expect_return_shape = "各実行ともexit 0し、detailは--tail 2では末尾2行のみ（先頭側の行は含まれない）、--full --tail 2では-f付き取得内容（FULL接尾・scrollback込み相当）の末尾2行、--tail 99では全行保持（切り詰め無し）"

[[condition]]
id = "read-send.read-partial-failure-exit6"
source_lines = "tests/cli/list_read_send.rs:605"
target_function = "read::run（per-pane失敗集計）"
source = "docs/design/detailed-design.md DD-6（失敗: per-pane失敗をresults[]で報告、exit 6（部分）または5（全失敗） / JSON: results[]: { target, title, tab, content | error }） + DD-4.3（exit status: 6 = 部分失敗（複数対象の一部失敗）。error.class対応: PartialFailure=6）"
description = "readのper-pane失敗集計の部分側: 対象の一部paneでdump-screenが失敗しても処理を打ち切らず、成功paneのcontentと失敗paneのerrorをresults[]へ混在報告した上でexit 6（PartialFailure）を返す。multi-target読み取りの部分失敗報告契約（成功entryとerror entryの混在）"
given = "fake zellij shimへper-pane失敗注入（複数対象のうち1 paneのみdump-screenが失敗する）を可能にした上で、zelper read 1 2 --jsonの実行"
expect_return = "exit 6（PartialFailure）。results[]は成功paneのentryがcontent（detail）を持ち、失敗paneのentryはerrorを報告する"

[[condition]]
id = "read-send.read-all-failure-exit5"
source_lines = "tests/cli/list_read_send.rs:644"
target_function = "read::run（per-pane失敗集計）"
source = "docs/design/detailed-design.md DD-6（失敗: per-pane失敗をresults[]で報告、exit 6（部分）または5（全失敗）） + DD-4.3（exit status: 5 = 操作失敗（単対象失敗、または複数対象の全失敗）。error.class対応: OperationFailed=5）"
description = "readのper-pane失敗集計の全失敗側: 対象全paneのdump-screenが失敗する場合はexit 5（OperationFailed）。部分失敗（exit 6）と全失敗（exit 5）はDD-4.3上で別exit code・別error.classとして規定される排他契約のため、read-partial-failure-exit6と別条件で検証する（失敗範囲の集計判定が独立した分岐であるため）"
given = "fake zellij shimへ失敗注入（対象全paneのdump-screenが失敗する）を可能にした上で、zelper read 1 2 --jsonの実行"
expect_return = "exit 5（OperationFailed）"

