[[condition]]
id = "read-send.read-single-and-multi-results"
source_lines = "tests/cli/list_read_send.rs:267"
target_function = "read::run"
source = "docs/testing/test-plan.md §2.4（read: 対象順のdump-screen呼び出し列） + docs/design/detailed-design.md DD-6（plan: 対象pane毎にdump-screen -p。順序はTargetSet順 / JSON: results[]: { target, title, tab, content | error }） + DD-1.3（PANESPEC = bare 3（=terminal_3）正規化）"
description = "readの対象解決と結果取得の基盤: 単数PANESPECはbare数値（1）をterminal_1へ正規化して解決し、JSONのresults[]にtargetとcontent（dump-screen結果）を格納する。複数PANESPEC指定も同経路で受理（§2.1のPANESPEC正規形要求のうちbare正規化を本条件が担う。CMR-5: bare正規化とresults構造を1条件に統合）"
given = "fake zellij shim（list-panes 3 pane・dump-screenはSCREEN[pane]を返す）に対するzelper read 1 --jsonとzelper read 1 2 --jsonの実行"
expect_return_shape = "単数時はexit 0かつresults[0].target=terminal_1・results[0].detail=SCREEN[terminal_1]改行。複数時はexit 0。検証限界: 複数時のresults順序とdump-screen呼び出し列の順序は未assert（successのみ）。--tail/--full加工は未検証（excluded参照）"

