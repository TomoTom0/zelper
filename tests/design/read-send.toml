[[condition]]
id = "read-send.send-broadcast-visual-order-calls"
source_lines = "tests/cli/list_read_send.rs:318"
target_function = "send::run"
source = "docs/testing/test-plan.md §2.4（send: text→write-chars呼び出し。fake shim: 呼び出しargv列の記録と期待比較（L3）） + docs/design/detailed-design.md DD-7（実行: text → write-chars -p。順序: TargetSet順に順次） + DD-6（順序はTargetSet順（tab position → y → x））"
description = "sendのtext送信がwrite-charsへmapされ、対象がvisual order（tab position → y → x昇順）で順次呼び出されること。broadcast系操作の実行順序の決定性（pane列挙順に依らない）をshimのargv記録で検証"
given = "fake zellij shim（terminal_1(y=1,x=0)・terminal_2(x=100)が同一tab）に対し、引数順とvisual順が逆になるようzelper send 2 1 -- yを実行"
expect_return = "exit 0かつwrite-chars呼び出しが2件で、順序はterminal_1 → terminal_2（visual order。引数順ではない）"

[[condition]]
id = "read-send.send-enter-appends-cr-and-keys-use-send-keys"
source_lines = "tests/cli/list_read_send.rs:335"
target_function = "send::run（--enter / --keys）"
source = "docs/testing/test-plan.md §2.4（--enterで追加のwrite 13・--keys→send-keys argv分割） + docs/design/detailed-design.md DD-7（--enter → write -p 13。keys → send-keys -p（key毎に独立argv要素））"
description = "sendの送信形式map: textはwrite-chars、--enter併用時はtext送信後にCR（write 13）を追加、--keysはkey毎に独立argv要素を持つsend-keysへ。入力送信のbackend呼び出し契約（CMR-5: --enterのCR追加と--keysのargv分割を1条件に統合）"
given = "fake zellij shimに対するzelper send 1 --enter -- helloとzelper send 1 --keys Ctrl aの各実行"
expect_return = "前者はwrite-chars -p terminal_1 helloとwrite -p terminal_1 13の両方が呼ばれexit 0。後者はsend-keys -p terminal_1 Ctrl a（key毎の独立要素）が呼ばれexit 0"

