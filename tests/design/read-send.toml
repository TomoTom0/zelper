target_function = "read::run（全失敗時のresults同梱）"
source = "TASK-79 body（TR63-2 (e)系列: read全失敗時results同梱） + docs/design/detailed-design.md DD-6（失敗: per-pane失敗をresults[]で報告、exit 6（部分）または5（全失敗）） + DD-4.2（multi-target操作は results: [...] の配列。部分失敗を隠さない）"
description = "read全失敗時のresults同梱: 対象全pane失敗（exit 5）の場合もerror.data.results[]に全pane分の失敗entry（target・ok=false・error）を同梱する。per-pane失敗報告はexit 6/5の両方に適用される契約であり、read-all-failure-exit5がexit分類のみを検証するのに対し本条件は全失敗側の報告中身を検証する（部分側の中身はread-partial-failure-exit6が担う）"
given = "fake zellij shimへFAKE_FAIL_DUMP_SCREEN（terminal_1・terminal_2とも失敗）を設定した上で、zelper read 1 2 --jsonの実行"
expect_return = "exit 5（OperationFailed）。error.data.results[]は2件で、各entryはtarget=terminal_1/terminal_2・ok=false・errorにshim失敗出力（boom）を含む"

[[excluded]]
item = "readの--tail 0の値域（N=0指定時の挙動）"
source = "docs/testing/test-plan.md §2.4 + docs/design/detailed-design.md DD-6（--tail N（行末N行）はN>=1の挙動のみ規定しN=0の値域を規定しない）"
reason = "出典にN=0の挙動規定がなく実装由来の値域（apply_tailはSome(0)で空文字を返す）のため出典起点の条件化対象外。末尾N行の規定はread-tail-applies-to-last-n-linesが検証する"
decided_at = "2026-09-16"
decided_by = "claude"
