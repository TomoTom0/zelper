[[condition]]
id = "read-send.send-enter-cr-failure-exit5"
source_lines = "tests/cli/list_read_send.rs:1200"
target_function = "send::run（--enter併用時のCR書き込み失敗）"
source = "TASK-79 body（TR63-2 (a)系列: send --enter併用時CR失敗） + docs/design/detailed-design.md DD-7（--enter → write -p 13・失敗: per-pane報告） + DD-4.3（exit status: 5 = 操作失敗（単対象失敗）。error.class対応: OperationFailed=5）"
description = "send --enter併用時のCR書き込み（write -p 13）失敗の報告: text送信（write-chars）は別backend呼び出しのため、text成功後にCR書き込みのみが失敗したpaneは失敗扱いとなり、単対象ならexit 5（OperationFailed）でper-pane報告される。CR側のみの失敗がpane結果（ok=false・error）へ反映する分岐を検証する"
given = "fake zellij shimへFAKE_FAIL_WRITE（write -p失敗注入: terminal_1のみ）を設定した上で、zelper send 1 --enter --json -- helloの実行"
expect_return = "exit 5（OperationFailed）。error.data.results[0]はtarget=terminal_1・ok=false・errorにshim失敗出力（boom）を含む。shim logにwrite-chars -p terminal_1 hello（成功）に続いてwrite -p terminal_1 13（失敗）がこの順序で記録される（DD-7: CRはtext送信の後）"

