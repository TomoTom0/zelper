[[condition]]
id = "read-send.send-partial-failure-continues-remaining"
source_lines = "tests/cli/list_read_send.rs:667"
target_function = "send::run（部分失敗時の残対象継続）"
source = "docs/design/detailed-design.md DD-7（順序: TargetSet順に順次。部分失敗でも残対象へ継続（broadcast性質） / 失敗: per-pane報告） + DD-4.3（exit status: 6 = 部分失敗（複数対象の一部失敗）。error.class対応: PartialFailure=6）"
description = "sendのbroadcast性質: 対象の一部paneへの書き込みが失敗しても処理を打ち切らず、残対象への送信を継続する。1対象の失敗が後続対象の飛ばしに繋がらないことと、結果の部分失敗報告（exit 6）を検証する"
given = "fake zellij shimへper-pane失敗注入（visual order先頭の対象paneのみwrite-charsが失敗する）を可能にした上で、複数対象へのzelper send 1 2 -- helloの実行（失敗paneより後に残対象が続く構成）"
expect_return = "exit 6（PartialFailure）かつ、失敗paneより後の残対象へもwrite-chars呼び出しが実行される（継続）"

