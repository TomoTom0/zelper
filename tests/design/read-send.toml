[[condition]]
id = "read-send.read-full-passes-dump-screen-f"
source_lines = "tests/cli/list_read_send.rs:437"
target_function = "read::run → ZellijBackend::dump_screen（-f転送）"
source = "docs/testing/test-plan.md §2.4（read: --fullの加工） + docs/design/detailed-design.md DD-6（request: --full（scrollback） / plan: 対象pane毎にdump-screen -p（full指定時-f）） + docs/design/design-review.md §4.2 MR-30（--tail系test不在指摘・test追加はP1）"
description = "--full指定時のbackend転送: readのdump-screen呼び出しに-fが付くこと。scrollback込み取得はzellij側機能のためzelperは加工せず-f引数の転送のみ行う（非--full時と対象解決・results構造は同一経路）"
given = "fake zellij shim（dump-screenは-pのpaneにSCREEN[pane]を返し、-f検出時はFULL接尾付き。全argvはlogへ記録）に対するzelper read 1 --full --jsonの実行"
expect_return = "exit 0かつshim logにdump-screen -p terminal_1 -fが記録され、results[0].detailは-f応答（SCREEN[terminal_1]FULL）に変わる"

[[condition]]
id = "read-send.read-tail-applies-to-last-n-lines"
source_lines = "tests/cli/list_read_send.rs:465"
target_function = "read::run（apply_tail）"
source = "docs/testing/test-plan.md §2.4（read: --tail Nの加工） + docs/design/detailed-design.md DD-6（request: --tail N（行末N行、zelper側加工。--tailは取得済み内容——viewport、--full指定時はscrollback込み——の末尾N行に適用） + JSON: results[]: { target, title, tab, content | error }。--tailはcontentに適用） + docs/design/design-review.md §4.2 MR-30（apply_tail経路は実装済み・tail testはP1）"
description = "--tail Nのzelper側加工: 取得済みcontentを末尾N行へ切り詰め、JSON resultsのcontent（detail）へ格納する。適用対象は取得形態の末尾N行（viewport / --full併用時はscrollback込み）で、両形式を1条件で検証（CMR-5: --tail単体と--full併用の2形式を統合。DD-6 request節が1文で両者を規定）。Nが行数以上の場合は切り詰められず全行保持の境界を含む。加工は出力前のapply_tail単一経路のためhuman出力にも同一の加工済み内容が現れる（検証はJSONで実施）"
given = "fake zellij shimのdump-screen応答を環境変数で複数行内容（例: 識別可能な5行）へ差し替えられるようにした上で、zelper read 1 --tail 2 --json・zelper read 1 --full --tail 2 --json・zelper read 1 --tail 99 --json（N >= 行数）の各実行"
expect_return_shape = "各実行ともexit 0し、detailは--tail 2では末尾2行のみ（先頭側の行は含まれない）、--full --tail 2では-f付き取得内容（FULL接尾・scrollback込み相当）の末尾2行、--tail 99では全行保持（切り詰め無し）"

[[condition]]
id = "read-send.send-broadcast-visual-order-calls"
source_lines = "tests/cli/list_read_send.rs:324"
target_function = "send::run"
source = "docs/testing/test-plan.md §2.4（send: text→write-chars呼び出し。fake shim: 呼び出しargv列の記録と期待比較（L3）） + docs/design/detailed-design.md DD-7（実行: text → write-chars -p。順序: TargetSet順に順次） + DD-6（順序はTargetSet順（tab position → y → x））"
description = "sendのtext送信がwrite-charsへmapされ、対象がvisual order（tab position → y → x昇順）で順次呼び出されること。broadcast系操作の実行順序の決定性（pane列挙順に依らない）をshimのargv記録で検証"
given = "fake zellij shim（terminal_1(y=1,x=0)・terminal_2(x=100)が同一tab）に対し、引数順とvisual順が逆になるようzelper send 2 1 -- yを実行"
expect_return = "exit 0かつwrite-chars呼び出しが2件で、順序はterminal_1 → terminal_2（visual order。引数順ではない）"

[[condition]]
id = "read-send.send-enter-appends-cr-and-keys-use-send-keys"
source_lines = "tests/cli/list_read_send.rs:341"
target_function = "send::run（--enter / --keys）"
source = "docs/testing/test-plan.md §2.4（--enterで追加のwrite 13・--keys→send-keys argv分割） + docs/design/detailed-design.md DD-7（--enter → write -p 13。keys → send-keys -p（key毎に独立argv要素））"
description = "sendの送信形式map: textはwrite-chars、--enter併用時はtext送信後にCR（write 13）を追加、--keysはkey毎に独立argv要素を持つsend-keysへ。入力送信のbackend呼び出し契約（CMR-5: --enterのCR追加と--keysのargv分割を1条件に統合）"
given = "fake zellij shimに対するzelper send 1 --enter -- helloとzelper send 1 --keys Ctrl aの各実行"
expect_return = "前者はwrite-chars -p terminal_1 helloとwrite -p terminal_1 13の両方が呼ばれexit 0。後者はsend-keys -p terminal_1 Ctrl a（key毎の独立要素）が呼ばれexit 0"

