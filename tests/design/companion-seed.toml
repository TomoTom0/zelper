[[condition]]
id = "companion-seed.r23-missing-permissions-appended-keeping-others"
source_lines = "tests/fake_backend/companion_seed.rs:50"
target_function = "seeded_content"
source = "docs/testing/test-plan.md §2.7 (c) R23（node存在・権限不足 → 不足権限のみ追記して書戻し（他node・他権限は保持）） + docs/design/detailed-design.md DD-10.4 手順2"
description = "権限不足時の追記: 不足権限のみをcompanion nodeへ追記し、既存の他node・他権限は保持する（過剰な重複追記をしない）"
