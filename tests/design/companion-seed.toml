[[condition]]
id = "companion-seed.r21-missing-file-creates-fresh-node"
source_lines = "tests/fake_backend/companion_seed.rs:34"
target_function = "seeded_content"
source = "docs/testing/test-plan.md §2.7 (c) R21（file不存在 → dir作成 + companion nodeのみの新規file） + docs/design/detailed-design.md DD-10.4 手順1"
description = "seed判定の純粋部分（file不存在）: 既存内容がNoneならcompanion node（必要3権限付き）のみの新規file内容を返す。dir作成を伴う実file書込はr21-ensure-creates-dir-and-file-when-missing条件が検証"
given = "seeded_content(None, companion node名) を呼ぶ"
expect_return = "Some（companion node blockのみ・必要3権限すべての子nodeを持つ新規file内容）"

[[condition]]
id = "companion-seed.r22-node-with-all-permissions-is-no-change"
source_lines = "tests/fake_backend/companion_seed.rs:43"
target_function = "seeded_content"
source = "docs/testing/test-plan.md §2.7 (c) R22（node存在・必要3権限すべてあり → 何もしない（書き込まない）） + docs/design/detailed-design.md DD-10.4 手順2"
description = "seed判定の純粋部分（権限充足）: companion nodeが存在し必要3権限すべてあれば書込内容なし（None）を返す（冪等check）。実fileの非書換はr22-ensure-leaves-complete-file-untouched条件が検証"
given = "companion nodeが必要3権限すべてを持つ既存内容をseeded_contentへ与える"
