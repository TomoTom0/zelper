[[condition]]
id = "companion-seed.r24-absent-node-pure-text-append-with-newline-guard"
source_lines = "tests/fake_backend/companion_seed.rs:74"
target_function = "seeded_content"
source = "docs/testing/test-plan.md §2.7 (c) R24（node不在 → file末尾へのtext純append。既存内容が改行終端でなければ先頭に改行を補完） + docs/design/detailed-design.md DD-10.4 手順2（設計レビューR1） + docs/design/design-review.md §4.6 R1"
description = "node不在時の純append: kdl round-trip整形によらずfile末尾へtextとしてappendする（既存内容は改変されない）。既存内容が改行終端でなければ先頭に改行を補い、前行末尾への連結によるKDL破壊を防ぐ（設計レビューR1）"
given = "他plugin nodeのみの既存内容（改行終端あり）と改行終端なしの2種をseeded_contentへ与える"
expect_return = "両者とも既存内容を先頭にそのまま保持し末尾にcompanion node blockが追記される。改行終端なしの場合は追記部の前に改行が補完される"

[[condition]]
id = "companion-seed.r25-unparsable-existing-file-is-preflight-error"
source_lines = "tests/fake_backend/companion_seed.rs:99"
target_function = "seeded_content / ensure_permissions"
source = "docs/testing/test-plan.md §2.7 (c) R25（既存fileのKDL parse失敗 → 書き換えずPreflight error（手動修復を促す）） + docs/design/detailed-design.md DD-10.4 手順3"
description = "parse失敗時の防御: 既存fileがKDLとして不正なら書き換えずPreflight error（ユーザーの他plugin権限を壊すリスクの排除を優先）。実fileも書き換えない（CMR-5統合: 判定と実file非書換を1条件に統合）"
given = "未closeのquote nodeを含む不正KDLをseeded_contentへ与える場合と、同内容の実fileに対しensure_permissionsを実行する場合"
expect_return = "両者ともErr（ErrorClass=Preflight）。実fileの内容は不正KDLのまま不変"

