[[condition]]
id = "companion-seed.r22-ensure-leaves-complete-file-untouched"
source_lines = "tests/fake_backend/companion_seed.rs:129"
target_function = "ensure_permissions"
source = "docs/testing/test-plan.md §2.7 (c) R22（node存在・必要3権限すべてあり → 何もしない（書き込まない）） + docs/design/detailed-design.md DD-10.4 手順2"
description = "seedの実file書込（権限充足）: 権限が揃っている既存fileは書き換えない（冪等。毎回checkはfile読込1回で安価というDD-10.2 #3の前提）。検証限界: testはfile内容の同一性のみassertであり、mtime等による書込非発生の直接確認は未assert"
given = "必要3権限すべてを持つcompanion nodeのfileに対しensure_permissionsを実行"
expect_return = "Ok。file内容は実行前と完全に同一"

[[condition]]
id = "companion-seed.r26-write-is-atomic-single-complete-content"
source_lines = "tests/fake_backend/companion_seed.rs:141"
target_function = "ensure_permissions"
source = "docs/testing/test-plan.md §2.7 (c) R26（書込みは同dir temp file作成 + atomic rename（readerが途中状態を観測しない）） + docs/design/detailed-design.md DD-10.4（書込みの原子性）"
description = "atomic書込のL2側検証: 書込結果はseeded_contentの結果と完全に一致する単一の完全な内容であり（部分書込・新旧混在がない）、同dirに一時fileが残留しない。検証限界: temp file + renameの機構自体の実機確認はL4（S-v2-1。remap-sequence.tomlのexcluded参照）"
given = "他plugin node（古い内容）の既存fileに対しensure_permissionsを実行"
expect_return = "Ok。書込後のfile内容がseeded_contentの期待内容と完全一致し、同dirにはpermissions.kdlのみ存在"

[[condition]]
id = "companion-seed.r27-conflicting-rewrite-is-retried-on-new-content"
source_lines = "tests/fake_backend/companion_seed.rs:170"
target_function = "ensure_permissions"
source = "docs/testing/test-plan.md §2.7 (c) R27（書戻し直前の再読込で内容が変化していたら、変化後の内容に対してやり直す（bounded retry 3回）） + docs/design/detailed-design.md DD-10.4（書戻し直前の再読込・変更検知） + docs/design/design-review.md §4.6 R2"
description = "競合時のretry: 書戻し直前の再読込でzellij他processの書換（競合）を検出したら、変化後の内容に対してseed判定をやり直す。1回の競合なら成功し、最終内容は競合後の内容に基づく（他node保持・不足権限追記）"
given = "他plugin nodeの既存fileに対しensure_permissionsを、再読込のtimingで1回だけ他内容（他plugin node + 権限1つのみのcompanion node）へ書き替えるhook付きで実行"
expect_return = "Ok。最終file内容は競合後内容への追記結果（他plugin node保持・companion nodeにReadCliPipesとChangeApplicationStateが揃う）"

[[condition]]
id = "companion-seed.r28-persistent-conflict-aborts-without-writing"
source_lines = "tests/fake_backend/companion_seed.rs:207"
target_function = "ensure_permissions"
source = "docs/testing/test-plan.md §2.7 (c) R28（retry打ち切り後も競合が続く → 書込まずPreflight error（last-writer-winsで他pluginの権限を黙って失わせない）） + docs/design/detailed-design.md DD-10.4 + docs/design/design-review.md §4.6 R2"
description = "競合継続時の中断: 再読込のたびに内容が変わり続ける（競合が続く）系列では、bounded retry打ち切り後に書込まずPreflight errorで中断する。errorには競合であることが伝わり、zelperはfileへ何も書いていない"
given = "再読込毎に異なる内容（カウンタ増加するrace node）へ書き替えるhook付きでensure_permissionsを実行"
expect_return = "Err（ErrorClass=Preflight・messageにconflict/retryを含む）。fileにcompanion nodeは存在しない（zelper未書込）"

[[condition]]
id = "companion-seed.concurrent-seeds-serialize-via-advisory-lock"
source_lines = "tests/fake_backend/companion_seed.rs:259"
target_function = "ensure_permissions（advisory lock）"
source = "docs/design/design-review.md §4.7 C2（TASK-39レビュー: permissions.kdlの「再読込一致→rename」間のTOCTOU残存への (a) zelper自身の並行実行に対するadvisory lock（flock）で読込→書込区間を直列化。直列化の回帰テスト（BがAのlock解放までblockすることの所要時間固定）を追加） + docs/design/detailed-design.md DD-10.4（既知の残リスク (b)）"
description = "zelper間書込の直列化（C2回帰）: Aがcritical section内で遅延している間に開始したBは、Aのlock解放（= Aの書込完了）までblockする。Bの所要時間で固定し、最終内容はlost-updateなし（Aの書込をBが読んで追記）。lock fileは抜けたら削除される"
given = "同一permissions.kdlへ、hook内で300ms遅延するA（companion node追記）と、Aのhook突入後に開始するB（別versionのcompanion node追記）を並行実行"
expect_return_shape = "Bの所要時間が250ms以上（Aの残り保持時間以上）でhook実行順はA→B。最終内容に他plugin node・Aのnode・Bのnode・追記権限がすべて含まれ、lock fileは残留しない"

[[condition]]
id = "companion-seed.stale-lock-file-tolerated-and-removed"
source_lines = "tests/fake_backend/companion_seed.rs:332"
target_function = "ensure_permissions（advisory lock）"
source = "docs/design/design-review.md §4.7 C2（残留lock fileの追試） + docs/design/detailed-design.md DD-10.4（advisory lock file（flock）・Dropでunlock+削除）"
description = "残留lock file耐性（C2回帰）: 異常終了等で残留したlock fileがあってもacquireは機能し、抜ける時にlock fileを削除する"
given = "lock file（.zelper-seed.lock）を事前に置いたdirのpermissions.kdl（不存在）に対しensure_permissionsを実行"
expect_return = "Ok。lock fileは削除され、fileは必要3権限付きcompanion node blockで作成される"

[[condition]]
id = "companion-seed.failed-seed-write-leaves-no-partial-temp-file"
source_lines = "tests/fake_backend/companion_seed.rs:346"
target_function = "ensure_permissions"
source = "docs/design/design-review.md §4.7 C4（TASK-39レビュー: temp fileのwrite自体の失敗時に部分書込tempが残留。write失敗経路でbest-effortのremove_fileを追加。temp pathをdirectoryで塞いでwrite失敗を発生させるテスト） + docs/design/detailed-design.md DD-10.4"
description = "seed書込失敗時のtemp残留なし（C4回帰）: temp file pathをdirectoryで塞いでwrite失敗を発生させても、zelperは新規の部分書込temp fileを残留させない（best-effort cleanup）。失敗はPreflight error"
given = "権限1つのみのcompanion node file（書込が試みられる状態）と、temp file pathを塞ぐdirectoryを置いたdirでensure_permissionsを実行"
expect_return = "Err（ErrorClass=Preflight）。dir内の残留は事前に作ったdirectoryとpermissions.kdlのみ（zelperは新規fileを作っていない）"

[[condition]]
id = "companion-seed.failed-wasm-extract-write-leaves-no-partial-temp-file"
source_lines = "tests/fake_backend/companion_seed.rs:382"
target_function = "ensure_companion_wasm"
source = "docs/design/design-review.md §4.7 C4（TASK-39レビュー: wasm extract・permissions seed両方のwrite失敗経路でbest-effortのremove_fileを追加。テスト2件） + docs/design/detailed-design.md DD-10.3（runtime配置: cache dirへextract。書込は同dirのtemp file + atomic rename）"
description = "wasm extract失敗時のtemp残留なし（C4回帰）: companion wasm extractのtemp書込失敗でも新規fileを残留しない。XDG_CACHE_HOME隔離下でcompanion_dir()の解決から検証"
given = "隔離XDG_CACHE_HOME下でcompanion_dir()を作成し、wasm temp file pathを塞ぐdirectoryを置いた状態でensure_companion_wasmを実行"
expect_return = "Err（ErrorClass=Preflight）。dir内の残留は事前に作ったdirectoryのみ"

