# permissions.kdl seed（src/companion.rs）の検証条件。出典: test-plan §2.7 (c) R21〜R28・(j) seed書換競合・DD-10.4・design-review §4.7 C2/C4
# 対応test: tests/fake_backend/companion_seed.rs（14件。1条件=1 test fnの1:1対応。設計書§2.3/3.4）
# tempdir実file込みで検証する（L2）。形式はE6実験（node名 = plugin wasm絶対pathのquoted KDL node・権限は子のbare node）に基づく
[meta]
feature = "companion-seed"
