[[condition]]
id = "backend-parser.terminal-command-field-parsed"
source_lines = "tests/unit/parser.rs:106"
target_function = "parse_panes（PaneInfo.terminal_command → PaneState.terminal_command）"
source = "docs/design/remap-v2-matching-fix-task74.md §2.1（PaneInfo.terminal_command field追加。#[serde(default)]付きで旧fixture互換〔TR74-1〕）・§2.5・§3（TR74-4直交fixtureのparser層配置） + docs/design/detailed-design.md DD-10.1 事実5（F1: terminal_command = invoked_with()の序列化。F2: pane_command = PTY前景processでinvoked_withと無関係）"
description = "terminal_command fieldのparse（TASK-74照合key変更のdata基盤）: list-panes JSONのterminal_commandをPaneState.terminal_commandへ変換する。null→None・文字列→Some。TR74-4直交2 paneを含むJSONで、pane_commandの値がterminal_commandのparseに影響しないこと（両fieldの直交性）を固定する。terminal_command keyを欠損した旧fixture（tests/fixtures/*.json・test内JSON）はNoneとしてparseし既存testは修正なしで継続（TR74-1）。旧実装はfieldを保持せずparse結果にterminal_commandが現れないためfail-first"
given = "TR74-4直交2 paneを含むlist-panes JSON（P-shell-proc: terminal_command=null + pane_command=\"vim src/main.rs\" / P-cmd-pane: terminal_command=\"claude --model x\" + pane_command=null）と、terminal_command keyを欠損した旧fixture JSON"
expect_return = "P-shell-procはterminal_command=None・pane_command=Some(\"vim src/main.rs\")、P-cmd-paneはterminal_command=Some(\"claude --model x\")・pane_command=None。key欠損JSONはterminal_command=Noneとしてparse成功"

[[condition]]
id = "backend-parser.empty-output-parses-to-none-not-error"
source_lines = "tests/unit/parser.rs:126"
target_function = "parse_panes_opt / parse_tabs_opt"
source = "docs/design/remap-v2-matching-fix-task74.md §2.3（parser.rsにparse_panes_opt/parse_tabs_optを追加。list_panes_lenient/list_tabs_lenientのparse基盤）・§2.5 + docs/design/detailed-design.md DD-10.7 空応答のlenient取得（空・exit 0 → Ok(None)。非空でparse失敗・非zero exit → 従来どおりErr〔fatal〕）・DD-10.1 事実5（F8: screen繁忙時のlist-panesはstdout空・exit 0を返す）"
description = "lenient parseの空出力扱い（TASK-74副因Cのparse基盤）: 空文字列入力（exit 0・stdout空の空応答）はOk(None)（条件未成立としてretry可能な値）へ変換しerrorにしない。非空かつ不正JSONはErr（fatal・従来どおり）。非空かつ正当JSONはOk(Some(..))。空応答をparse error扱いするとpoll中のremapが中途断するため、空と不正の区別が致命的境界になる（設計書§3表からは独立に§2.3/§2.5のparser変更分として条件化）"
given = "空文字列・非空の不正JSON（garbage）・非空の正当JSONをparse_panes_optとparse_tabs_optへ与える"
expect_return = "空文字列はOk(None)・garbageはErr・正当JSONはOk(Some(..))（panes/tabs両関数とも同一分岐）"
