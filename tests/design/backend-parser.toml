[[condition]]
id = "backend-parser.sessions-name-marker-substrings-do-not-pollute-fields"
source_lines = "tests/unit/parser.rs:61"
target_function = "parse_sessions"
source = "tmp/tasks/tm-99/design_parse-field-pollution.md §3.5決定・§4（anchor化parse仕様: t=trim_end・exited=ends_with(\"(EXITED - attach to resurrect)\")・current=ends_with(\"(current)\")・created=rfind(\"[Created \")・name=先頭word不変）・§2.1（0.44.3行形式の固定性: [Created ...]節常時・name直後・suffix排他一択・Created節の後の行末）・§5 test構成（設計レビューminor-2対応の4境界fixtureを含む） + tmp/tasks/tm-98/design_name-truncation.md §5 minor-2(i)（TASK-98: 空白含み名5行のname期待値を完全名〔marker直前の区切りASCII空白1文字のみ除去〕へ更新。field非汚染assertは不変・name復元の正本はsessions-whitespace-name-restored-to-full-name条件） + docs/design/detailed-design.md DD-3.4（list-sessions -nテキストparse）"
description = "marker部分文字列の非汚染: 名前の2語目以降（空白含み名）にmarker部分文字列（EXITED・(current)・[Created）を含む行でも、生成metadata field（exited/current/created）が名前由来の部分文字列で汚染されない。生成節・suffixは行末側の固定順序で置かれるため、anchor系判定（ends_with/rfind・trailing space対応）により名前内容から構造的に分離できる（名前が行末に来得ないことの帰結）。名前が完全な[Created ...]字面を含む場合も最後尾出現（rfind）が真の生成節を選ぶ。fail-first: 現行rest.contains系判定は名中の部分文字列を拾うため汚染系caseが赤（TASK-99実装〔anchor化〕で緑化）。TASK-98: name期待値は空白含み名5行のみ完全名（x EXITED / cur (current) / x [foo / pre [Created 5m ago] / y (EXITED - attach to resurrect)）へ更新——単語名行（s0・d・live・d2）とmarker不在2行（weird行=先頭word fallback）は従来値のまま"
given = "汚染5系列+非汚染境界4系列+本物marker回帰2系列のlist-sessions -n出力（11行）: 名2語目にEXITEDを含むrunning行 / (current)を含む行 / `[`を含む行 / 名前が完全な[Created 5m ago]を含む行 / 名前末尾が完全なEXITED suffix字面と一致するrunning行（汚染5系列）に加え、trailing space付きsuffixなし行 / 本物suffix後に空白がある行 / [Created 不在行（`[`不含） / `[`を含むが[Created marker不在の行（weird [foo]——find('[') fallback不復帰の固定〔レビューminor-2〕）の非汚染境界4系列、本物(current)行・本物EXITED suffix行の回帰2系列"
expect_return = "空白含み名5行のnameは完全名（marker直前の区切りASCII空白1文字のみ除去——x EXITED / cur (current) / x [foo / pre [Created 5m ago] / y (EXITED - attach to resurrect)）。単語名行とmarker不在2行のname=先頭wordは不変（weird行はfallback）。(i)名中EXITEDのrunning行はexited=false・created=真の生成節 (ii)名中(current)行はcurrent=false (iii)名中`[`行のcreatedは真の生成節（名前側の節でない） (iv)完全な[Created ...]含み名はcreated=最後尾出現（1m ago） (v)名末尾EXITED字面のrunning行はexited=false (vi)trailing space付きsuffixなし行はflags false・created取得済 (vii)本物suffix後空白行はexited=true（trim_end対応） (viii)[Created 不在行はcreated=None・flags false（`[`を含む行〔weird [foo]〕も同様——find('[') heuristicへは戻さないためname側の節を掴まない）。回帰: 本物(current)行はcurrent=true・本物EXITED行はexited=true"

