# backend parser（src/zellij/parser.rs）の検証条件。出典: test-plan §2.3・DD-3.1/3.4/3.5・DD-10.5・DD-11・design-review §4.9
# 対応test: tests/unit/parser.rs（6件。1条件=1 test fnの1:1対応。設計書§3.4）
