[[condition]]
id = "backend-parser.version-strings"
source_lines = "tests/unit/parser.rs:7"
target_function = "parse_version"
source = "docs/testing/test-plan.md §2.3（version文字列の判定。DD-3.1・3.5） + docs/design/detailed-design.md DD-3.1（zellij --versionを起動時にparse） + DD-3.5（capability detection: 最小0.44.3・実証済み0.44.x系列超過の検出）"
description = "zellij --version出力文字列のparse: major/minor/patchを取り出す。version gate（0.44.3以上/未満/未来系列/parse不能の判定）の入力となる"
given = "zellij 0.44.3（末尾改行付き）・zellij 0.44.1・zellij 0.43.2・zellij 1.0.0 の各文字列と、不正文字列 garbage"
expect_return = "Some((0,44,3))・Some((0,44,1))・Some((0,43,2))・Some((1,0,0))・None"

[[condition]]
id = "backend-parser.sessions-text-basic-form"
source_lines = "tests/unit/parser.rs:17"
target_function = "parse_sessions"
source = "docs/testing/test-plan.md §2.3（list-sessions -n テキストfixture → SessionInfo（色なし形式）） + docs/design/detailed-design.md DD-3.4（list-sessionsはJSON不在のため -n のテキストをparse（NAME [Created X ago]形式））"
description = "list-sessions -nテキストの基本形式parse: nameとcreated相対表記を行単位でSessionInfoへ変換する。suffixなし行はcurrent/exitedともfalse"
given = "zeller-p1-basic [Created 10s ago] と zeller-p1-ops [Created 2m ago] の2行（suffixなし）"
expect_return = "2件。s[0]はname=zeller-p1-basic・created=10s ago・current=false・exited=falseを検証。s[1]はname=zeller-p1-opsまで（created・flagsは未assert）"

[[condition]]
id = "backend-parser.sessions-parse-flags-current-and-exited"
source_lines = "tests/unit/parser.rs:30"
target_function = "parse_sessions"
source = "docs/testing/test-plan.md §2.3（list-sessions -n テキストfixture → SessionInfo） + docs/design/design-review.md §4.9 TASK-44（suffixは空/(current)/(EXITED - attach to resurrect)の3値。zellij v0.44.3 print_sessions実出力と突合） + docs/design/detailed-design.md DD-3.4（EXITED行もflag付きで返し、実行中のみへの絞り込みは呼び出し側）"
description = "session行の3種suffix（なし・(current)・(EXITED - attach to resurrect)）をcurrent/exited flagへparseする。parseはEXITED行を含む全行を返し、絞り込みは呼び出し側（resolve_session・list sessions）が行う契約（DD-3.4の責務分担）"
given = "EXITED行・(current)行・suffixなし行が混在する3行のlist-sessions -n出力"
expect_return = "3行ともparseされ、dead-oneはexited=true/current=false、live-oneはcurrent=true/exited=false、live-twoは両方false。exited=falseでfilterすると2件"

[[condition]]
id = "backend-parser.created-ids-from-stdout"
source_lines = "tests/unit/parser.rs:54"
target_function = "parse_created_pane / parse_created_tab"
source = "docs/testing/test-plan.md §2.3（new-pane stdout（terminal_7と改行）/ new-tab stdout（3と改行）のID parse） + docs/design/detailed-design.md DD-3.4（new-pane/new-tabのstdoutをparseしてID取得）"
description = "add系verbの結果特定に必要な生成ID parse: new-paneのstdout（terminal_N）とnew-tabのstdout（整数）をIDへ変換する。不正出力はerror"
given = "terminal_1と改行・1と改行・空文字列・非数文字列 abc"
expect_return = "terminal_1はPaneKindId::Terminal(1)、1はTabId(1)。空文字列とabcはerror"

[[condition]]
id = "backend-parser.panes-json-full-fields-from-real-output"
source_lines = "tests/unit/parser.rs:66"
target_function = "parse_panes"
source = "docs/testing/test-plan.md §2.3（list-panes -a --json実出力fixture → PaneState変換の全field） + docs/design/detailed-design.md DD-3.4（list-panes -a --jsonをserdeで直接decode） + DD-10.5（source = selectable tiled terminal pane（is_remap_source判定））"
description = "list-panes -a --jsonの実出力形式をPaneStateへ全field変換する（id・title・selectable・floating・geometry・command・cwd・tab情報）。terminal paneはremap sourceとなりnon-selectable plugin paneはならない判定を含む（CMR-5: 1fnが§2.3全field変換とDD-10.5 source定義を検証するため1条件に統合）"
given = "Phase 1実出力（out/02-panes-multi.json）相当の、terminal 1件（command・cwd付き）とplugin 1件（non-selectable・zellij:tab-bar）のJSON"
expect_return_shape = "2件のPaneState。先頭はTerminal(1)・command・geometry.cols=100・is_remap_source=true、plugin側はPlugin(2)・is_remap_source=false"

[[condition]]
