description = "入れ子base（実形状）でのchildren置換のbar leaf配置と抽出経路の回帰条件（TASK-74 E2E acceptanceで検出されたtest gapへの対応。既存template-children-substitutionはtemplateを直接組み立てたflat 2-slot baseのfixtureであるため、実layoutからの抽出経路とbase subtreeの入れ子が検証できていなかった）。layout { ... } wrapperを持つ実layoutを与えたときdefault_tab_template_subtreeのtemplateがSomeであり、children nodeをbase subtreeのnodesで置換した生成KDLにおいてbar leaf（pane size=1 borderless=true { plugin location=\"zellij:compact-bar\" }）がbase subtreeのnodesと同階層のtop-level siblingとして出現し、どのcolumn（split_direction container）・terminal pane nodeの内側にも入らないこと。run注入はterminal slotのみ（bar leafはslot消費なし・run注入なし。MR-32規則の入れ子base拡張）。fail-first: 現行実装（codex実装・commit cde4cd4）はdefault_tab_template_subtreeが文書root直下のnodeのみを探索してlayout node配下のdefault_tab_templateを見つけられず、実layoutからは常にtemplate=Noneが返るため生成KDLにbar leafが一切出現せず、期待「bar leafがtop-level siblingに出現する・template抽出はSome」に対して機械的にfailする（実測: acceptance (ii) でbar paneがb_dump.kdlの3番目column内cellとしてgrid挿入されたのはこの経路。置換機構自体はtemplate=Someが渡れば入れ子baseでも現行実装で動くため、本条件のgivenは実layoutからの抽出経路を必ず通ること）。TASK-74再更新（2026-09-15 E2E run3・fail-first）: 生成KDLのboolean属性はquoteなしの真偽値形式（borderless=true）で出力されること——現行実装（run3 binary）はboolean属性をquote付き文字列化（borderless=\"true\"）して出力しzellij 0.44.3 layout parserに拒否される（tmp/task74/acceptance/b_remap.json）ため本条件にfailする。L1既存test（tests/unit/layout_generator.rs: bar leafのborderlessをas_stringで比較）がquote付き形式を期待値に内包していたためE2E run3まで検出できなかった（test側期待値の修正は後段のtest更新作業）。TASK-75（v2.2）: template抽出経路はnormalize_tab_templates（正規形TabTemplate列構築）へ一元化（default_tab_template_subtree/base_subtreeは廃止。期待値は不変・test入力はnormalize経由へ読み替え）"
given = "9-pane.kdl相当の実形状layout（layout { default_tab_template { children; pane size=1 borderless=true { plugin location=\"zellij:compact-bar\" } } tab name=\"T\" { pane split_direction=\"horizontal\" 配下に 3 × pane split_direction=\"vertical\" { pane; pane; pane } } }）をnormalize_tab_templatesで正規形化し（T=1・鋳型subtreeがtemplate反映済み〔bar leafを含む〕で取得できること・9 slot）、run列 [cmdA, None×8] をgenerate_instance_kdl_v2(正規形subtree, runs)へ与える"
expect_return = "生成KDLのlayout node直下は2 node: horizontal container（文書順9 terminal slot・slot 0のみcmdA注入）+ bar leaf。bar leafはtop-level siblingとして出現し、任意の split_direction=\"vertical\" node（column）やterminal pane nodeの内側に出現しない。bar leafへのcommand/args注入は行われない。bar leafの属性はboolean属性 borderless がquoteなし真偽値（borderless=true）・数値属性 size がquoteなし整数（size=1）で出力され、quote付き文字列形式（borderless=\"true\"・size=\"1\"）はzellij 0.44.3 layout parser拒否のため不可（文字列属性〔location等〕はquote付き）。生成KDLを再parseするとterminal slot数 = 9（bar leafはplugin leafのため数えない）"

[[condition]]
id = "layout-generator.per-tab-kdl-from-normalized-templates"
source_lines = "tests/unit/layout_generator.rs:397"
target_function = "generate_instance_kdl_v2 / remap::instance_kdls（Vec<Vec<String>>: blocks × tabs）"
source = "docs/design/remap-v3-multi-tab-task75.md §2.1（default_tab_templateがある場合、各tabのsubtreeはchildren置換適用済み。実験R75-1: default_tab_templateは全tabに展開され各tab subtree末尾にbar leafとして現れる）・§2.6（生成KDLは現行per-tab形式を維持: tab nodeなしのlayout { subtree }形式を生成tab (b,t)毎に個別適用。slotへのrun注入規則はv2.1のまま変更なし。baseは当該tabの正規形subtree）・§3.3（generate_instance_kdl_v2はtemplate引数を削除。instance_kdlsはVec<Vec<String>>〔blocks × tabs〕を返すよう一般化） + docs/design/detailed-design.md DD-10.8 v2.2（base = 当該tab鋳型の正規形subtree） + requirements.md §2.6（default_tab_template由来要素の全tab再現）"
description = "正規形subtreeからのper-tab KDL生成: multi-tab layoutでは生成tab (b,t)毎に、当該鋳型の正規形subtree（children置換済み・tab属性除去済み）をbaseとした生成KDLを個別に返す。template由来bar leafは全tabの生成KDLへ出現し（R75-1: zellij --layout起動時の全tab展開と同一）、run注入は当該tabのterminal slotのみ。tab属性（name・focus）は生成KDLに載せない（rename-tab-by-id・go-to-tab・focus-pane-idで再現。D7）。fail-first: 現行実装のinstance_kdlsは最初のtab鋳型のみのKDL列（Vec<String>）しか返さない"
given = "default_tab_template（children + compact-bar）付き・T=2（鋳型0=2 slot・鋳型1=1 slot）のlayoutをnormalize_tab_templatesへ通し、run列 [cmdA, cmdB]（鋳型0）と [cmdC]（鋳型1）で生成する"
expect_return = "鋳型毎の2種の生成KDL: 鋳型0側は2 terminal slot（cmdA/cmdB注入）+ plugin location=\"zellij:compact-bar\" leaf、鋳型1側は1 terminal slot（cmdC注入）+ 同一bar leaf。両KDLともtab nodeなしのlayout { ... }形式で、他鋳型のsubtree nodeを含まない"
