source = "tmp/tasks/tm-87/design_verb-extension.md §2.6 step4（全pane error → OperationFailed exit 5） + §4.1（全pane障害 = OperationFailed 5）"
description = "全pane障害の分類: 対象全paneのdump_screenが失敗する系列はPartialFailure（exit 6）でなくOperationFailed（exit 5）。一部=6・全て=5の失敗範囲集計判定が独立した分岐であるためexhaust-partial-failureと別条件で検証する（readのread-all-failure-exit5と対になる。設計§5.1の条件計画に個別掲載がないが§4.1の要求行のため計画外追加）"
given = "fake backend（2 pane。両paneともdump_screenが失敗する構成）に対する--max 2のwatch --json実行"
expect_return_shape = "exit 5（OperationFailed。PartialFailure〔exit 6〕でない）"

[[excluded]]
item = "watch照合テキストへのANSI除去（CSI/OSC）正規化（normalize_for_match）の導入"
source = "tmp/tasks/tm-87/design_verb-extension.md §2.6（M7でANSI escape含有が確認された場合のみ、ANSI除去正規化をwatch照合にのみ導入する条件付き規定） + tmp/tasks/tm-86/m7_result.log（M7実測証跡） + TASK-86 body手順1（2026-09-25）"
reason = "M7実測（2026-09-25・zellij 0.44.3・podman sandbox）でdump-screen出力にANSI escape混入なしと確認（全dumpでESC(0x1b) byte count 0。色消去・cursor移動は最終grid状態へ解消・OSC 8 link除去・行末空白trim・wrap join）。設計が定めた導入条件（escape含有の確認）が不成立のため、normalize_for_matchはv1で不導入・dump-screen生テキスト直接照合に確定（TASK-86 body手順1）。正規化挙動が実装に存在しないため条件化対象外（read出力への同一正規化は設計上も別変更・本設計範囲外）"
decided_at = "2026-09-25"
decided_by = "claude"

