[[condition]]
id = "watch.interval-sleep-and-attempt-count"
source_lines = "tests/fake_backend/watch.rs:165"
target_function = "watch::run（polling loop）"
source = "tmp/tasks/tm-87/design_verb-extension.md §2.6 step3c（attempt < max → sleep(interval)（前poll終了後のsleep。drift許容）→ 次attempt） + §4.2（data/error.dataのattempts_used・elapsed_secs） + §5.3（watchのtestは--max 1〜2・--interval 1で実行時間を抑制〔interval下限1s仕様の帰結〕） + REVIEW-1〔codexレビュー〕: sleep位置〔初期sleepなし・最終attempt後なし〕のtest保証強化（sleepの注入可能化・呼出回数計上）"
description = "polling loopの構造: attempt間にintervalのsleepを挟み（初期sleepなしはt0-immediate-first-pollが担保）、最終attempt後にはsleepしない。sleep呼び出し回数・値は注入クロージャで直接計上し（max=2でexhaust時は呼び出し1回のみ・値はintervalそのもの）、試行回数はdump_screen呼び出し回数として計上されattempts_usedへ現れる（過不足pollなし）。設計§5.1の条件計画に個別掲載がないため計画外追加（polling系: interval sleep・試行回数計上）"
given = "fake backend（常にno hitのframe構成・呼び出し記録・sleep記録注入〔実sleep併用〕・経過時間計測）に対する--interval 1 --max 2のwatch実行"
expect_return_shape = "回数切れ（exit 5）かつ各paneのdump_screen呼び出しが2回（= max。最終attempt後の過剰pollなし）・sleep呼び出しは1回のみ（attempt 1と2の間。値はinterval）・error.data.attempts_used = 2・elapsed_secs >= 1.0（attempt間sleepあり）かつinterval×maxを大きく超えない（最終attempt後にsleepしない）"

[[condition]]
id = "watch.pane-vanish-continue"
source_lines = "tests/fake_backend/watch.rs:202"
target_function = "watch::run（dump失敗paneの除外と継続）"
source = "tmp/tasks/tm-87/design_verb-extension.md §2.6 step3a（dump失敗（pane消滅等）: 当該paneを以後のattemptから除外し pane_errors へ記録（他paneは継続）） + step2（対象解決（1回のみ）: 毎poll再解決しない） + §4.2（hit dataのpane_errors） + §5.1（pane-vanish-continue）"
description = "polling中のpane障害の扱い: dump_screen失敗paneは以後のattemptから除外され（失敗後の再pollなし）、他paneのpollingは継続される。障害はpane_errorsへ記録され、生存paneでのhitが優先される（hit時もexit 0でpane_errorsを併記）。対象解決が開始時1回であることはlist_panes呼び出し回数1で観察する。回数切れ時のexit分類（6/5）はexhaust-partial-failure・exhaust-all-pane-failure-exit5が担保する"
given = "fake backend（2 pane。pane 1は途中のattemptからdump_screenが失敗〔pane消滅模擬〕・pane 2は後続attemptでhitするframe構成・list_panes/dump呼び出し記録）"
expect_return_shape = "exit 0（pane 2のhit）かつpane 1の失敗以降の同paneへのdump呼び出しなし・pane 2は継続pollされhit・data.pane_errorsにpane 1が記録・list_panes呼び出しは1回（開始時のみ）"

