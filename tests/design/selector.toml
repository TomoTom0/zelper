# target resolver（src/selector.rs）の検証条件。出典: test-plan §2.2・DD-1.3/1.4/2・requirements §2.8・DD-11
# 対応test: tests/unit/selector.rs（10件。1条件=1 test fnの1:1対応。設計書§3.4）
[meta]
feature = "selector"
source_file = "src/selector.rs"
verified = true
verified_at = "2026-09-13"
verified_by = "claude"
test_command = "cargo test --test selector"
source_hash = "4616e8124f66c0064e3420f79b5f314aee30515e"
note = "TASK-61: 移行時excluded 2件（--cwd一致filter・filter 0件→NoTarget）をtest追加により条件化し、--name完全一致の検証限界（CMR3-3）を解除。src/selector.rsは不変のためsource_hash再計算不要"

[[condition]]
id = "selector.positional-id-resolution-and-no-target"
source_lines = "tests/unit/selector.rs:94"
target_function = "resolve"
source = "docs/testing/test-plan.md §2.2（positional ID解決: 存在確認・存在しないID） + docs/design/detailed-design.md DD-1.4（選択規則: 対象0件はno target matched error） + DD-2（TargetSet）"
description = "positional PANESPEC（pane ID指定）の解決基盤: 存在するpane IDは当該paneのみを選択し、positional指定したpane IDが不在ならNoTarget error（filter結果0件の失敗とは別code path。filter 0件はselector.filter-zero-matches-no-targetが検証）。全verb共通の対象解決の最初の分岐"
given = "tab混在・floating混在・non-selectable pluginを含むPaneState列に、Terminal(1)のpositional指定と、存在しないTerminal(99)のpositional指定を与える"
expect_return = "存在するID指定は当該1件のTargetSet。存在しないID指定はErrorClass=NoTarget"

[[condition]]
id = "selector.filter-name-exact-and-command-partial"
source_lines = "tests/unit/selector.rs:114"
target_function = "resolve"
source = "docs/testing/test-plan.md §2.2（filter option: --name完全一致・--command部分一致） + docs/design/detailed-design.md DD-1.4（--nameはtitle完全一致・--commandはpane_command部分一致）"
description = "filter optionの一致規則: --nameはtitle完全一致のみ、--commandはpane_command部分一致で複数paneにhitする。send --command等の集合選択の基礎"
given = "title=agent-a（command=codex exec）とtitle=agent-b（command=codex exec）を含むPaneState列に、--name agent-a指定・--command codex指定・--name agent指定（両titleの部分文字列）をそれぞれ与える"
expect_return = "--name agent-aは1件、--command codexは2件、--name agentは完全一致せず0件でNoTarget（完全一致→部分一致への回帰を検出）"

[[condition]]
id = "selector.filter-cwd-exact-match"
source_lines = "tests/unit/selector.rs:141"
target_function = "resolve"
source = "docs/testing/test-plan.md §2.2（filter option: --cwd一致） + docs/design/detailed-design.md DD-1.4（--cwd DIR = pane_cwd一致）"
description = "--cwd filterの一致規則: pane_cwdとの完全一致で対象を選択し、前方一致は採らない。cwd Noneのpane（floating等）は対象外。作業dir基準の対象選択の基礎"
given = "cwd=/tmpのterminal pane 4件・cwd Noneのselectable floating pane・non-selectable pluginを含むPaneState列に、--cwd /tmp指定と--cwd /tm指定（既存cwdの前方一致）を与える"
expect_return = "--cwd /tmpはcwd=/tmpの4件のみ。--cwd /tmは完全一致せず0件でNoTarget（前方一致でhitする回帰を検出）"

[[condition]]
id = "selector.filter-zero-matches-no-target"
source_lines = "tests/unit/selector.rs:163"
target_function = "resolve"
source = "docs/testing/test-plan.md §2.2（0件（NoTarget）） + docs/design/detailed-design.md DD-1.4（対象0件 → no target matched error）"
description = "filter option指定の結果0件はno pane matched error（NoTarget）。positional不在IDのpane not found分岐（selector.positional-id-resolution-and-no-target）とは別のresolve終端分岐"
