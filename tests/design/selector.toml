[[condition]]
id = "selector.single-target-ambiguous-with-candidates"
source_lines = "tests/unit/selector.rs:229"
target_function = "resolve_single"
source = "docs/testing/test-plan.md §2.2（単一対象要求（rename）で複数ヒット: AmbiguousTarget + 候補列出） + docs/design/detailed-design.md DD-1.4（単一対象を要求するverbで複数ヒット→ambiguous target error（候補一覧を出力））"
description = "単一対象を要求する経路（rename等）の解決: 複数ヒットはAmbiguousTarget errorで候補を列出し、単一ヒットは成功。誤操作防止の境界条件"
given = "--command codex指定（2 paneにhit）と、Terminal(3)の単数positional指定をそれぞれresolve_singleに与える"
expect_return = "複数ヒット時はErrorClass=AmbiguousTargetで候補2件。単数時はOk"

[[condition]]
id = "selector.tab-resolution-by-id-or-unique-name"
source_lines = "tests/unit/selector.rs:248"
target_function = "resolve_tab"
source = "docs/testing/test-plan.md §2.2（filter option: --tab（ID/一意名）） + docs/design/detailed-design.md DD-1.3（TABSPEC = tab ID（整数）または一意なtab名。一意ならIDへ解決、曖昧なら候補列出のerror）"
description = "TABSPEC（全verbの--tab optionとrename tab/remove tab positionalで共通）の解決: 数値はtab ID、一意な名前は該当tab IDへ解決、同名複数tabはAmbiguousTarget、存在しない指定はNoTarget。検証限界: AmbiguousTarget時の候補列出はclass assertのみで候補中身は未assert（pane側の候補assertはsingle-target条件が検証）"
given = "同名agents 2tab（ID 1・2）と一意名build（ID 5）のTabState列に、ID指定・一意名指定・曖昧名指定・不在ID指定を与える"
expect_return = "ID指定と一意名buildはTabId(5)。曖昧名agentsはErrorClass=AmbiguousTarget。不在IDはErrorClass=NoTarget"

[[condition]]
id = "selector.empty-tab-definition"
source_lines = "tests/unit/selector.rs:288"
target_function = "TabState::is_empty"
source = "docs/design/first/260821/requirements.md §2.8（空tab削除の要求） + docs/design/detailed-design.md DD-11（空tabの定義: --empty: 空tab = selectable な pane（tiled+floating両方）が0個のtab）"
description = "remove tab --emptyの対象判定となる空tabの定義: selectable pane（tiled+floating両方）が0個のtab。non-selectable pluginのみのtabは空、floating 1個でも空ではない"
given = "selectable tiled/floating countが0のTabStateと、selectable_floating_panes_count=1のTabState"
expect_return = "前者はis_emptyがtrue、後者はfalse"
