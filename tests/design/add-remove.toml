[[condition]]
id = "add-remove.add-partial-failure-keeps-created-no-rollback"
source_lines = "tests/fake_backend/rename_add_remove.rs:204"
target_function = "add::run_pane / add::run_tab（count>1の途中失敗）"
source = "docs/design/detailed-design.md DD-11 add失敗（作成済み分は残存させ、per-target結果報告（rollbackしない）） + DD-12 atomicity（部分失敗時は実行済み操作の一覧を報告）"
description = "addのcount>1途中失敗: 2回目のnew-pane/new-tab呼出失敗は作成済み分をstateへ残存させ（rollbackしない）・error messageへ作成済みID（created so far: [...] (kept; no rollback)）を載せる（add_partial）。初回失敗（created空）は「created so far」を付与しない素のerror（add_partialの空分岐の保護）。失敗注入はfail_opのprefix照合でname連番（w-2/t-2）を持つ2回目呼出のみに当てる"
given = "FakeBackendへの失敗注入で (a) add::run_pane(count=2, name=w)の2回目new-pane失敗 (b) add::run_tab(count=2, name=t)の2回目new_tab失敗 (c) add::run_pane(count=2)の初回new-pane失敗"
expect_return = "(a)(b)はErr（class保持=OperationFailed・exit 5）でmessageにcreated so far: [\"terminal_2\"]/[\"1\"]と(kept; no rollback)を含み作成済み分（w-1 pane・t-1 tab）がstateに残存 (c)は「created so far」を含まない素のinjected failure"

[[condition]]
id = "add-remove.remove-partial-failure-continues-remaining-targets"
source_lines = "tests/fake_backend/rename_add_remove.rs:367"
target_function = "remove::run_pane / remove::run_tab（順次実行・部分失敗）"
source = "docs/design/detailed-design.md DD-11 remove失敗（順次実行・部分失敗報告（残対象も実行）） + DD-4.3（部分失敗=6(PartialFailure)・error dataへper-target results[]）"
description = "removeの部分失敗: 3対象の順次実行で2番目のcloseが失敗しても残対象（3番目）も実行され、per-target結果（error dataのresults[]。失敗対象のみok=false）をPartialFailure（exit 6）で報告する。失敗対象はstateに残存し成功対象は消失（rollback・中断なし）。session系の部分失敗はremove-session.tomlが担うため本条件はpane/tab nounに限る。失敗注入はfail_opのprefix照合で2番目のclose呼出のみに当てる"
given = "FakeBackend（3 pane/3 tab構成）への失敗注入（close-pane terminal_2・close-tab 1のみ失敗）で (a) remove::run_pane([1,2,3], yes=true) (b) remove::run_tab([0,1,2], yes=true)"
expect_return = "(a)(b)ともErr（PartialFailure・exit 6）・data.results[]は3対象分で2番目のみok=false（残対象も実行された）・stateは失敗対象のみ残存（terminal_2・tab 1とそのpane）"
