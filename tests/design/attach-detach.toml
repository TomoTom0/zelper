[[condition]]
id = "attach-detach.add-session-argv-postcondition"
source_lines = "tests/cli/list_read_send.rs:1226"
target_function = "add::run_session"
source = "tmp/tasks/tm-87/design_verb-extension.md §1.3（add session NAME: detached session作成。v1は素の作成のみ）・§2.3（create_session_detached(name) = run([\"attach\", \"-b\", name])。session解決に依存しないtop-level argv）・§2.7（create_session_detached(name) → postcondition: list_sessionsにNAMEがrunning出現（DD-11 addの存在確認規則に準拠）→ 報告）・§4.2（add session成功data: { \"session\": \"work\", \"created\": true }）・§4.3（`created session 'work' (detached)`）・§5.3（FAKE_SESSIONS_CREATE: attach -b応答制御） + 実測M5: tmp/tasks/tm-89/m5_result.log 形式A（positional `zellij attach -b m5s` は非TTYで成立: one-shot 56ms・rc=0・silent・list-sessionsにRUNNING出現。global --session形式は別名〔random名〕を作るため使用禁止——m5_result_run2.log §2） + TASK-85/TASK-89 body（成立判断の正本）"
description = "add session成功経路: 事前確認（同名runningなし）→ positional形式 `attach -b NAME`（top-level argv。--session接頭なし）→ postcondition（作成後のlist_sessionsにNAMEがrunning出現）→ 報告。argv形式のpositional必須はM5実測確定（global --session形式はrandom別名sessionを作る）。検証限界: 成功系のL3にはshimがFAKE_SESSIONS_CREATE=ok時に作成NAMEをlist-sessions応答へ反映する状態管理が必要（statelessだとpostconditionが常に不成立になる）"
given = "FakeBackend（list_sessions状態を保持しcreate_session_detachedでNAMEを追加）に対するrun_session(backend, NAME, json)の実行、およびfake zellij shim（FAKE_SESSIONS_CREATE=ok・作成NAMEのlist-sessions反映）に対するzelper add session NAME --jsonの実行"
expect_return_shape = "いずれもOk（exit 0）。backendのargvは `attach -b NAME`（--session接頭なし・-bとpositional NAMEの形式）。humanは `created session 'NAME' (detached)` の1行。JSONはenvelope 1通でdata.session=NAME・data.created=true"

