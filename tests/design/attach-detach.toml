[[condition]]
id = "attach-detach.add-session-precheck-list-failure-propagates"
source_lines = "tests/fake_backend/attach.rs:186"
target_function = "add::run_session（事前確認の一覧取得失敗）"
source = "tmp/tasks/tm-93/design_session-zero-missing.md D5（TASK-93設計書: 事前確認の失敗では作成呼出（attach -b）は不発。unwrap_or_defaultを?へ変更し一覧取得errorのclass/exitを保持して伝播——OperationFailedに限らずZellijUnavailable等もあり得るためclass保持が本質） + F7/REVIEW-2指摘5（従来のrc=1一律0件扱い＝真のbackend障害も0件に丸める妥協の解消）"
description = "add sessionの事前一覧取得失敗の伝播: list_sessionsの真の失敗（rc=1 marker不一致等）は0件へ丸めず、元class/exitのまま伝播する（fail-wrongの解消。OperationFailed exit 5・ZellijUnavailable exit 4の両注入でclass/exit保持を検証——OperationFailed特化でなくclass保持が本質）。作成呼出（attach -b）は不発になる。L2 FakeBackendのfail_op+inject_failure_as（list-sessions失敗注入・class差し替え）で検証。fail-first: 現行実装（unwrap_or_default）は事前エラーを握り潰して0件へ丸め、inject_failureは一度で消費されるため作成・事後確認とも成功してOkになり、unwrap_err()が失敗する（赤）"
given = "FakeBackendへinject_failure(\"list-sessions\")（最初のlist_sessions呼出を失敗注入。classは既定のOperationFailedとinject_failure_asによるZellijUnavailableの2種）した状態でのrun_session(backend, \"work\", json=true)の実行"
expect_return = "Err。classは注入と同一の保持（OperationFailedならexit 5・ZellijUnavailableならexit 4）。messageはinjected failure at 'list-sessions'を含む。callsにattach -b argvなし（作成不発）"

