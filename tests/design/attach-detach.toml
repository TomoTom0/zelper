# attach / detach / add session操作（src/app/attach.rs・src/app/add.rs run_session）の検証条件。
# 出典: TASK-87設計書 tmp/tasks/tm-87/design_verb-extension.md（§1.3 grammar・§2.2 dispatch・§2.3 trait/run_interactive・§2.5 attach.rs・§2.7 add session・§4 error/exit/JSON契約・§5.1-5.3 test計画）
#       + 実測M3/M4/M5（tmp/tasks/tm-89/m3_result.log・m3_result_run2.log・m4_result.log・m4_result_run2.log・m5_result.log・m5_result_run2.log・m5_result_run3.log）+ TASK-89/TASK-85 body（実測確定事実の正本）
#       + TASK-93設計書 tmp/tasks/tm-93/design_session-zero-missing.md（D2/D3/D5: 0個正常系化・--session不在名の事前存在確認・add session一覧取得失敗のclass保持伝播）
# 対応test（TASK-89手順5実施済み+REVIEW-2指摘5/6反映+TASK-93テスト先行更新。1条件=1 test fnの1:1対応）: fake_attach（L2・4件。TASK-93のadd session一覧取得失敗2系を含む）・tests/cli L3 shim拡張（10件。FAKE_DETACH_FAIL / FAKE_SESSIONS_CREATE / FAKE_SESSIONS_EMPTY〔0-session環境・0件文面はstderr出力〕・不在session名rc=1応答。TASK-93の非TTY attach解決先行1件を含む）・src/zellij/process.rs内test（run_interactive系2件。REVIEW-2指摘2/3の退避FD漏れ検証・SIGINT disposition往復を含む）
# 層帰属（設計§5.2/§5.3・低-9修正）: attachのTTY検査はL3実binary（非TTY exit 7 envelope）+ L2 tty_ok注入。run_interactive経路はsrc内#[cfg(test)]のみ（L3実binaryはTTY検査が先に立ち到達しない。TASK-93後は解決がTTY検査より先——attach-non-tty-resolution-precedes-tty-check）。detach/add sessionはL2 fake backend + L3 shim
[meta]
feature = "attach-detach"
source_file = "src/app/attach.rs"
verified = true
verified_at = "2026-11-12"
verified_by = "claude"
test_command = "cargo test"
source_hash = "bd4df5408619a3a4c01244a4e740d1daf0bf579e"
note = "TASK-89手順5作成（実装前test-first）→手順2〜6実装・test追従完了（2026-09-25）→REVIEW-2（codex）指摘8件対応で13条件へ拡張（指摘5の新規条件1件。指摘1/2/3/4〔capture一時file排他作成0600+unlink・退避FDのF_DUPFD_CLOEXEC・SIGINT SIG_IGNと契約明確化・restoreのEINTR再試行と失敗報告〕は実装修正、指摘6〔attach-successの実出力検証〕はL2 test強化、指摘7〔docs全切断案内削除〕はdocs修正、指摘8〔shim状態file初期化〕はshim setup修正）。src/app/add.rs run_session・src/zellij/process.rs run_interactive（trait定義はsrc/zellij/mod.rs）・src/main.rs AddTarget::Session例外dispatchも検証対象。設計§5.1計画8条件+レビュー/実測確定による追加分4条件+REVIEW-2追加分1条件。stderr契約（DD-3.1/DD-14と同一）: attach実行中の子fd 2はcapture file（fd 0/1は元targetを継承）・stderrは子終了後に一括転写・v1で即時転送なし。実行中はSIGINTを親側で一時SIG_IGN（子がSIGINT処理して終了→wait復帰→転写→報告。execでのSIG_IGN継承を避けるためinstallはspawn後）。run_interactiveのstderrは実装上、親fd 2を一時的capture fileへ差し替えた上で継承し（親子で同一fd targetを保持 = inherit×3の維持）、子終了後に本来のstderrへ転写・非zero終了時のerror messageへ埋め込む（attach-zellij-fail条件のstderr埋込みとattach-run-interactive条件のfd同一性を両立する実装）。TASK-93実装で全条件緑化（2026-11-12）→コードレビュー指摘1/3対応: precheck/postcheck両条件へZellijUnavailable（exit 4）注入caseを追加（fake.rsへinject_failure_as機構。class保持が本質であることの検証強化）・precheck条件のfail-first説明を旧実装の実際の挙動（inject_failureは一度で消費されるため握り潰し後は作成・事後確認とも成功してOkになり、unwrap_err()が失敗する）へ修正"

[[condition]]
id = "attach-detach.attach-non-tty-preflight"
source_lines = "tests/cli/list_read_send.rs:1378"
target_function = "attach::run_attach（TTY検査）→ run_attach_inner(backend, json, tty_ok)"
source = "tmp/tasks/tm-87/design_verb-extension.md §1.3（attach: TTY必須。非TTYはPreflight exit 7）・§2.5（TTY検証はstd::io::IsTerminalでstdin・stdout両方を検査。非TTYはPreflight「attach requires a TTY; for non-interactive session creation use zelper add session」。検証・本体はrun_attach_inner(backend, json, tty_ok)へ分離）・§4.1（attach: 非TTY Preflight 7）・§5.2/§5.3（低-9: L3実binaryは非TTY exit 7 envelope検証・TTY検査はtty_ok引数で注入） + 実測M4: tmp/tasks/tm-89/m4_result.log・m4_result_run2.log（全fd非TTYの素attachはzellijがpanic exit 101・stdout汚染84B。stdin=TTY/stdout=fileではzellijがUIを出さずtimeoutまでblock=rc 124。zellij実要件はstdin or /dev/ttyだが両検査維持が妥当と確定） + TASK-89 body（M4確定事実）"
description = "attachのTTY検査fail-fast: stdin・stdoutの両方がTTYでなければzellij attachを起動する前にPreflight（exit 7）で拒否する。M4実測により非TTY素attachはzellij側panic（exit 101・stdout汚染）とUI出力先不在でのblockという失敗形が確定しており、それらに到達させる前に止めることが本条件の目的。stdout片側のみ非TTY（pipe）の構成もblock防止のため拒否する（両検査）。誘導文で非対話作成（add session）への迂回を案内する"
given = "L3実binaryを非TTY環境（stdin・stdoutとも非TTY）で実行: zelper --session NAME attach --json（fake zellij shimをPATHへ差し込みFAKE_LOGで全argvを記録）。L2ではrun_attach_inner(backend, json, tty_ok=false)の引数注入（設計§5.2）"
expect_return = "exit 7（Preflight）。error envelopeのclass=Preflightで、messageはattach requires a TTYとzelper add session誘導を含む。zellij attach呼出は発生しない（FAKE_LOGにattach行なし。fail-fast）"

