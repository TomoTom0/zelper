[[condition]]
id = "list-display.layouts-symlink-follow-target-stat"
source_lines = "tests/cli/list_read_send.rs:352"
target_function = "list::run（Layouts: symlinkのSIZE/MODIFIED値源）"
source = "tmp/tasks/tm-82/design_symlink-stat.md §5決定・§6.2 test構成（TASK-82設計書: follow採用——SIZE/MODIFIEDはsymlinkをたどった内容実体のstat。壊れたsymlinkは名前を一覧へ残したうえで両値-〔JSON null〕。参照先stat取得失敗全般へ一貫適用） + docs/design/detailed-design.md DD-4.1（list layouts: NAME / SIZE / MODIFIED。file stat由来）"
description = "symlinkなlayout fileのSIZE/MODIFIED値源はlink先実体のstat（follow）: 実体1024 bytes・mtime固定過去epochの構成でSIZE/MODIFIED双方の値源を独立検証（SIZE: 実体1024 vs lstat残置ならlink先path長8。MODIFIED: 実体の固定epoch 1600000000 vs lstat残置ならlink作成時刻=now近傍）。壊れたsymlinkは名前を残して両値-〔JSON null〕——旧excluded「layoutsのstat失敗・mtime不明時の-表示」のstat失敗(None, None)系列を壊れたsymlinkで実体化して条件へ昇格（mtime不明系列はレビューminor-2でepoch変換失敗側=layouts-pre-epoch-mtime-modified-null条件とmodified() Err側=excludedへ分割）。fail-first: 現行実装はlstatのためlinked.size==8・modified_epochがnow近傍・brokenに値が出るため赤（TASK-82実装〔e.metadata() → fs::metadata〕で緑化）"
given = "ZELLIJ_LAYOUT_DIRへ (i) 実体real.kdl（内容を固定1024 bytesへ生成し、mtimeをtouch -d @1600000000で固定過去epoch 1_600_000_000〔2020-09-13T09:46:40Z〕へ設定） (ii) real.kdlへの相対symlink linked.kdl（link先path長8 bytes） (iii) 壊れたsymlink broken.kdl（不在target「no-such-target」指し）を置いた環境での zelper list layouts --json と zelper list layouts（human）の各実行"
expect_return = "JSON: nameはbroken/linked/realの3件sort済み。linked.size==1024・linked.modified_epoch==1600000000（実体由来。real.size==1024・real.modified_epoch==1600000000と同値）。brokenはsize/modified_epochともnull。human: header行 + 3行で、real/linked行ともSIZE==1024・MODIFIED列は同一epoch由来の相対表記（Nd Nh ago形を時間換算し行間差±1h以内——レビューminor-1: human_ageが行毎に現在時刻を取得するため境界跨ぎで稀に文字列不一致になる）。broken行はbroken TAB - TAB -"

