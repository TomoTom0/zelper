[[condition]]
id = "backend-process.nonzero-exit-operation-failed"
source_lines = "src/zellij/process.rs:412"
target_function = "ZellijCliBackend::run（非zero exit）"
source = "docs/testing/test-plan.md §2.3（zellijのerror出力（Failed to load layout: ...等、Phase 1失敗記録から）→ error class変換。旧本文・git 2a9c85f時点） + docs/design/detailed-design.md DD-5:265（zellij側errorをclass=OperationFailedで包む）・DD-10.14:512（class割当）"
description = "zellijの非zero exit終了は常にOperationFailedへ変換される: messageへexit statusとtrim済みstderr本文を埋め込む。stderr内容によるclass切替は設計上存在しない（DD-5:265・DD-10.14:512）"
given = "fake zellij test mutex下で、staging fileへwrite/chmod後にcloseしてatomic rename公開したscriptをwith_programで指向したbackendのrun()呼び出し（stderrへ Failed to load layout: ... を出力してexit 1）"
expect_return = "Err。class=OperationFailed。messageはexit status（exit status: 1）とtrim済みstderr本文を含み、改行を含まない（全文はpinしない）"

[[condition]]
id = "backend-process.spawn-notfound-zellij-unavailable"
source_lines = "src/zellij/process.rs:436"
target_function = "ZellijCliBackend::run（spawn NotFound）"
source = "docs/testing/test-plan.md §2.9（zellij不在でZellijUnavailable exit 4。cli-grammar.tomlのzellij不在excludedと同源） + docs/design/detailed-design.md DD-3.1"
description = "programが存在しない（spawn ErrのErrorKind=NotFound）場合の起動失敗はZellijUnavailableへ分類される。CLI levelのexit 4実pathはcli-grammar.tomlのexcludedに記録のまま（本条件はrun()機構側）"
given = "fake zellij test mutex下で、存在しないpathをwith_programで指向したbackendのrun()呼び出し"
expect_return = "Err。class=ZellijUnavailable。messageはzellij executable not found in PATHを含む"

[[condition]]
id = "backend-process.spawn-permission-denied-zellij-unavailable"
source_lines = "src/zellij/process.rs:462"
target_function = "ZellijCliBackend::run（spawn失敗: NotFound以外）"
source = "docs/design/detailed-design.md DD-5（zellij起動失敗系のerror分類）+ src/zellij/process.rs:66-70"
description = "NotFound以外のspawn失敗（実行権限なしによるEACCES等）もZellijUnavailableへ分類され、messageへ起動error本文を埋め込む。mode 0644（x bitなし）のexecはLinuxではrootにも拒否される（CAP_DAC_OVERRIDEでもS_IXUGO必須）ため、test実行userによらず決定的"
given = "fake zellij test mutex下で、実行権限なし（mode 0644）のfileをwith_programで指向したbackendのrun()呼び出し"
expect_return = "Err。class=ZellijUnavailable。messageはfailed to start zellij:を含む"

