source = "docs/design/detailed-design.md DD-10.7 step 6 照合不成立のreconciliation 4/5（TASK-81。2026-09-20 E2E改訂: pass 2は高々1回・複数slot同時反転可・command dup closeと同一passに載せる。pass 2後も過剰〔生きpane数 > N_t またはsnapshot非存在のexited/held pane残存〕なら以降の反転を行わず、残った新規spawn paneを属性・数突合版〔空slot正規spawn相当を除く〕でcloseして検証失敗（10.9）へ合流する。close試みができなかった・対応づかなかった新規id pane〔exited/held含む〕は検証失敗で報告）・DD-10.2 #14（高々1回）"
description = "反転の回数上限と残余のclose（TASK-81。E2E改訂で残余closeを属性・数突合版へ）: 反転（pass 2）は高々1回。pass 2後も当該tabに過剰（生きpane数 > N_t、またはsnapshot非存在のexited/held pane残存）が残る系列では、以降の反転を行わず、残った新規spawn paneをclose-pane（空slot正規spawn相当〔terminal_command=None群のうち空slot数に相当する分〕はclose対象から除く。command dup相当はargv一致でclose）して検証失敗（10.9）へ合流する（VerificationFailed。無限反復の構造的排除）。closeしたpaneはclosed_duplicatesへ報告"
