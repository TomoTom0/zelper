description = "floating paneの遮断と組入れ: scope（session全体）内にselectable floating terminal paneがあれば状態変更前にPreflight error（候補列出）。--embed-floating指定時はtoggle-embedでtiled化してsourceに組入れ、companion plugin pane（non-selectable）はtoggleしない・floatingのままsourceに混入しない（C1回帰）。検証限界: toggleがplan確定後であることの順序assertはなし（DD-10.7 step 4の順序は構造上の前置き）"
