source = "docs/design/remap-v3-multi-tab-task75.md §3.4（E2E要因B改訂・2026-09-16・実験4: 割当pane 0件のgroup〔空group〕は new-tab --layout-string <生成KDL> でtab作成時点で生成KDLを適用 → stdoutのtab id parse → rename-tab-by-id。旧経路〔layout引数なし→go-to→override-layoutで既定paneを正規化〕は既定pane〔bare shell〕がoverride-layoutのbare slotに照合されず残存しN_t+1 paneで検証(b)がfailするため不採用〔U75-10解決: bare slotはtab作成経路でのみ具体化され、override-layoutは既存paneとrun一致しない限り常に新規spawn〕。対抗案〔new-tab後にclose-pane〕は最終pane closeでtab自体が自動closeされるため不成立。step 6で当該groupはoverride-layoutをskip〔作成時点で適用済み〕）・§7.1（acceptance結果と実験4） + docs/design/detailed-design.md DD-10.7 5-b v2.2・DD-10.2 #8注記・DD-3.4（new-tab stdout parse・DD-3.2/11実績経路）"
description = "空groupのnew-tab --layout-string経路（TR75-5昇格のfake必須条件・E2E要因B改訂）: 割当0件のgroupはbreak-new（空list）ではなく new-tab --layout-string <生成KDL>（tab作成時点で生成KDL適用）でtabを作成し、stdoutのtab idをparseして（parse不能・非zero exitはOperationFailedで中断）直後にrename-tab-by-idで命名する（new-tab由来idはこのrenameで取得直後に消費）。step 6では当該tabへのoverride-layoutをskipし（作成時点で適用済み）、pane数==N_tが成立する（検証(b)で確認）"
given = "T=2（N_t=2,1・S=3）multi-tab layoutにM=2（k=1: (0,0)=2・(0,1)=0〔空group〕）でのrun（成立系）と、new-tab stdoutをparse不能出力にする失敗注入（fatal系）"
expect_return = "成立系はOk: new-tab --layout-string <生成KDL>呼出 → parse済みidでのrename-tab → step 6でgo-toするがoverride-layoutは不発生（作成時点で適用済み）・検証(b)でpane数==1（N_t）・生成tab名どおり。fatal系はErr（ErrorClass=OperationFailed）。pipe break-newの空list呼出は不発生"

[[condition]]
id = "remap-sequence.focus-pane-id-after-override-per-tab"
source_lines = "tests/fake_backend/remap.rs:1281"
target_function = "remap::run（layout適用phase step 6のfocus-pane-id）"
source = "docs/design/remap-v3-multi-tab-task75.md §2.4（pane focus〔D5〕E2E要因A改訂・2026-09-16: 各生成tab訪問時にgo-to-tab → override-layoutの直後（空groupはoverride-layout skip直後）に focus-pane-id を実行。対象pane idはmappingでなく適用後のlist-panes〔lenient〕で当該tabのterminal paneをvisual order〔geometry y,x昇順〕に並べたs番目〔s = 鋳型pane_focus_slot、無ければslot 0〕から決定する——bare pane群のrun一致配置が割当順と一致しないためmapping基準だと実幾何とずれる〔acceptance b系列実測〕。空slot〔spawn pane〕も位置から特定可能なため全生成tabで実行〔occupied限定撤廃〕。呼出失敗はwarning・「already focused」のexit 2はfocus状態が実際に成立しているため成功扱い・反映は検証(d)で検知）・§3.5（責務分担TR75-10: backendはargv組み立てとResultを返す薄い実装のみ。Errのwarning化・実行継続はexecute側の責務） + docs/design/detailed-design.md DD-10.7 step 6 v2.2・DD-10.1 事実6 + requirements.md §2.6（per-tab pane focus再現）"
description = "focus-pane-id per tab（E2E要因A改訂: 対象の位置ベース決定）: layout適用phaseで各生成tab (b,t)の処理は go-to-tab → override-layout（空groupはskip）→ list-panes（lenient・空応答はpoll再試行）→ focus-pane-id terminal_<対象pane id> の順で行われる。対象pane idは当該tabのterminal paneをvisual order（geometry y,x昇順）に並べたs番目（s = 鋳型pane_focus_slot、無ければslot 0）から決定し、mappingのpane idは用いない。空slot（spawn pane）も位置から特定可能なため全生成tabで実行する（occupied限定撤廃）。呼出失敗（backend Err）はwarningとして継続し、focus未反映は検証(d)（pane-focus-verified-via-is-focused）がVerificationFailedとして検知する。「already focused」のexit 2はfocus状態が実際に成立しているため成功扱い（warningを出さない）。T=1でも新たに実行される（T=1後方互換の保証範囲外——TR75-3）。argv形式はbackend-process.focus-pane-id-argvが管轄"
given = "pane focus=true（slot 1）を持つT=2 multi-tab layoutでのrun（各tabのfocus対象slot 1/slot 0の割当pane）、focus-pane-id呼出をErrにしfocusが未反映のままになる失敗注入run、focus対象slotが最終blockで空slot（spawn pane）になる構成、およびfocus_paneが「already focused」のexit 2相当を返す注入run"
expect_return = "正常系はOkで呼び出し列に各tabのgo-to→override-layout→focus-pane-id terminal_<適用後の位置から決定したpane id>がこの順で現れ、空slot対象tab（spawn pane・new-tab --layout-string生成pane）でもfocus-pane-idが実行される。失敗注入はOperationFailedではなく検証(d)によるVerificationFailedとして検知（呼出失敗はwarningで継続するため）。already focused注入はrun成功（focus状態が成立しているのと同義）"

[[condition]]
id = "remap-sequence.final-go-to-honors-template-focus"
source_lines = "tests/fake_backend/remap.rs:1425"
target_function = "remap::run（step 7最終go-to先の決定則）"
source = "docs/design/remap-v3-multi-tab-task75.md §2.4（tab focus: layoutにfocus=trueの鋳型があれば文書順最初のfocus=true鋳型t*についてblock 0のtab (0,t*)を最終go-to先とする。無ければanchor復帰〔現行〕。focus復帰はbest-effort維持〔復帰失敗は操作失敗にしない〕）・§5.2 (v)系列a/b/c（tab focus決定則matrix・TR75-7） + docs/design/detailed-design.md DD-10.7 step 7 v2.2"
description = "最終go-to先の決定則: layoutのfocus=true鋳型の文書順最初t*についてblock 0のtab (0,t*)へ最終go-toする。focus=true鋳型なし（またはT=1）はanchor復帰（現行挙動と同一）。複数tabのfocus=trueは文書順最初を採用する（E2E系列bでは複数focus検出のwarning出力を含む）。best-effort維持で復帰失敗は操作失敗にしない（r42と同一規則）。fail-first: 現行実装は常にanchor復帰のためfocus=true鋳型を含む構成でfail-first"
given = "T=3 multi-tab layoutでfocus=trueを鋳型1のみに付与したrun（系列a相当: 最終go-to先は新規tab側）、tab 0とtab 2の両方にfocus=trueを付与したrun（系列b相当: 文書順最初のtab 0）、focus=trueなしのrun（系列c相当: anchor復帰）"
expect_return = "系列aは最終go-toの呼出対象が (0,1) のtab id（anchorでない）。系列bは文書順最初の (0,0)（=anchor）。系列cはanchor。いずれもrunはOk（最終go-toは検証後・best-effort）"

