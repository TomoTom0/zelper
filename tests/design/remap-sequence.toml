source_lines = "tests/fake_backend/remap.rs:202"
target_function = "remap::run（preflight floating検出・--embed-floating）"
source = "docs/testing/test-plan.md §2.7 R8（floating pane存在 → Preflight error。--embed-floatingでtoggle（plan確定後の状態変更第1歩）を経てsourceに組入れ） + docs/design/detailed-design.md DD-10.5（floating pane: selectable floating terminalがあればpreflight error。--embed-floatingでtoggle-pane-embed-or-floatingによりtiled化。toggled化対象はpreflightで特定したselectable floating terminalのみ）・DD-10.2 #13 + docs/design/design-review.md §4.7 C1（toggle対象をselectable floating terminalのID集合のみに限定する回帰assert）"
description = "floating paneの遮断と組入れ: scope（session全体）内にselectable floating terminal paneがあれば状態変更前にPreflight error（候補列出）。--embed-floating指定時はtoggle-embedでtiled化してsourceに組入れ、companion plugin pane（non-selectable）はtoggleしない・floatingのままsourceに混入しない（C1回帰）。検証限界: toggleがplan確定後であることの順序assertはなし（DD-10.7 step 4の順序は構造上の前置き）"
given = "4 pane / 2 tab + anchor外tabのfloating pane構成で、--embed-floatingなしのrun（エラー系）と、--embed-floatingありのrun（組入れ系: 4 tiled + 1 floating = M=5 → k=2）"
expect_return = "なし側はErr（ErrorClass=Preflight・candidatesにterminal_9）でpipe不発生。あり側はOkでtoggle-embed terminal_9が呼ばれ（plugin_系はtoggleされない）、selectable floating paneが残らず全5 paneが配置される"

[[condition]]
id = "remap-sequence.r29-probe-only-when-move-needed"
source_lines = "tests/fake_backend/remap.rs:278"
target_function = "remap::run（companion setup要否判定）"
source = "docs/testing/test-plan.md §2.7 (d) R29（probeは移動が必要な場合のみ実行（k>1、またはgroup 0にanchor外tabのpaneが存在）。移動が不要ならprobeもpluginも不使用） + docs/design/detailed-design.md DD-10.7 step 3（companion setup — break系移動が必要な場合のみ〔v2.2: k>1、またはgroup (0,0)〔anchor group〕にanchor外tabのpaneが存在〕。break系を使わない（空groupのnew-tabのみ等）場合はprobeもpluginも不使用） + docs/design/remap-v3-multi-tab-task75.md §3.4（move_needed判定の一般化: k > 1 または group (0,0) にanchor外paneが存在、または新規tab（k*T - 1 > 0）が存在。probe要否は「break系を使用するか」（k > 1 または group(0,0) outbound非空）に分離）"
description = "companion setup/probeの実行条件: 移動が不要（k=1・group (0,0)にanchor外paneなし）ならprobe pipeもcompanion setup（permissions.kdl書換）も行わない。移動が必要（k=2）ならprobe pipeが実行される。TASK-75（v2.2）: move_needed判定は「新規tab存在（k*T-1 > 0）」を含むよう一般化されるが、probe要否はbreak系pipeを使用するか（k>1 または group (0,0) outbound非空）へ分離される——空groupのnew-tabのみで新規tabを作る構成（新規tabあり・break系なし）はprobe/companion不使用（remap-sequence.new-tab-only-needs-no-companionが検証）。検証限界: k=1でgroup (0,0)にanchor外paneが存在する構成（R29判定のもう一方の条件）は未検証"
given = "3 pane同一tab（k=1・T=1・移動不要）でのrunと、4 pane / 2 tab（k=2・移動あり）でのrun"
expect_return = "前者はOkかつpipe呼び出し0回・permissions.kdl未作成。後者はOkかつpipe probe が呼ばれる"

