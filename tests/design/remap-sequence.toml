source = "docs/design/remap-v3-multi-tab-task75.md §3.6（(d) pane focus〔E2E要因A改訂: 位置ベース〕: 各生成tab (b,t)で当該tabのterminal paneをvisual order〔geometry y,x昇順〕に並べたs番目〔s = pane_focus_slot.unwrap_or(0)〕のpaneのis_focused == true〔list-panes経由。非active tabもis_focusedを持つ〔実測・R75-3〕〕。step 6のfocus対象決定と同一の位置基準で全生成tabが対象〔空slot tab除外は撤廃〕） + docs/design/detailed-design.md DD-10.9 (d) v2.2・DD-10.1 事実6（R75-3: list-panesのis_focusedは全tabでlayout指定どおり各1 paneがfocused）"
description = "検証(d) pane focus（E2E要因A改訂: 位置ベース）: 検証はlist-panesのis_focusedで行い、各生成tab (b,t)の期待focus対象（当該tabのterminal paneをvisual order〔geometry y,x昇順〕に並べたs番目。s = pane_focus_slot or slot 0。step 6のfocus対象決定と同一基準）のpaneがis_focused == trueであることを確認する。非active tabも検証対象（R75-3: 全tabで各1 paneがfocused）。全生成tabが対象（空slot tab除外は撤廃）。focus未反映（focus-pane-id呼出失敗のwarning経路を含む）はVerificationFailedとして検知される"
