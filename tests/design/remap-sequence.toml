[[condition]]
id = "remap-sequence.poll-deadline-not-extended-by-slow-backend-call"
source_lines = "tests/fake_backend/remap.rs:876"
target_function = "remap::run（poll deadline）"
source = "docs/design/design-review.md §4.7 C3（TASK-39レビュー: polling deadlineがcond()（list_panes等）の所要時間を考慮しない。deadline超過後の条件成立を成功扱いしうる → pollをbackend呼出ごとにdeadline再検査する形に修正。10.3s遅延したlist_panesがprobe title成立を返す系列では中断する回帰テスト） + docs/design/detailed-design.md DD-10.7（polling定数: 250ms間隔・10s deadline）・DD-10.7 空応答のlenient取得・fatal条件(a)（polling timeout文面にscreen繁忙の1s timeout機構への言及を含める） + TASK-74段階8コードレビューCR74-4（probe側timeout文面にF8機構注記が欠けていた。この文面は権限問題と誤診されうる）"
description = "polling deadlineの厳密性（C3回帰）: deadlineはbackend呼出（poll内のlist-panes取得〔lenient〕）の所要時間を含めて保証し、deadline超過後に条件が成立していても成功扱いにしない。遅延実行を成功扱いしないため状態変更へ進まない。probe poll timeoutの文面は権限hintとともに、timeoutがscreen繁忙（screen応答1s timeoutによる一時的な空list応答）でも起こりうる旨のF8機構の注記を含む（CR74-4: 空応答を権限問題と誤診させない。fail-first: レビュー時点の実装のprobe側timeout文面は権限hintのみでscreen繁忙の注記を欠く）"
given = "4 pane / 2 tab構成で最初のpipe（probe）後のpoll内list-panes取得（lenient）を10.3s遅延させ、probe titleが現れている状態でdeadlineを越える失敗注入をしたrun"
expect_return = "Err（ErrorClass=OperationFailed・messageにprobeとscreen繁忙の1s list応答timeout機構の注記（screen/busy/1s/empty等の語）を含む）。pipe break-・override-layoutは不発生"

