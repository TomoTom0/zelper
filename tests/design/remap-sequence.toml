source = "TASK-74段階8コードレビューCR74-1（template系LayoutInvalid検証〔children marker不在・leaf数不一致〕がexecute step 6でしか走らず状態変更後に発火。partial_phase報告も省略される。DD-10.7前提・設計§2.2違反） + docs/design/detailed-design.md DD-10.7 前提（全preflight〔layout解決・plan・floating検出・companion setup〕を状態変更前に完了させる順序）・DD-10.8（children node不在・置換後terminal leaf数不一致はLayoutInvalid）・DD-10.6 v2.2（N_t=0鋳型はLayoutInvalid・正規形化〔layout解決〕時点で判定） + docs/design/remap-v2-matching-fix-task74.md §2.2（preflight追加検証: …LayoutInvalidで事前中断） + docs/design/remap-v3-multi-tab-task75.md §3.4（空groupのみの実行のpreflight depth: layout解決・N_t=0検証・正規形化children置換検証・plan・生成KDL計算を状態変更前に完了）"
description = "template系・N_t=0系LayoutInvalidの事前検証（CR74-1修正の核。TASK-75で対象拡大）: 生成KDL計算がLayoutInvalid（children marker不在・children block不在・置換後leaf数不一致）または鋳型N_t=0となるlayoutでは、run()の状態変更前（v2.2ではnormalize_tab_templates（layout解決）・plan・生成KDL計算の時点）で中断する。probe pipe・toggle-embed・break/move・rename・go-to-tab・override-layout・focus-pane-id・new-tab・companion setup（wasm extract・permissions.kdl書換）のいずれも発生しないことをfake backendの呼び出し記録とfilesystem状態で検証する。fail-first: レビュー時点の実装はinstance_kdlsをexecute step 6（probe・toggle・break/move・rename後）に計算するため、invalid templateで状態変更実行後にLayoutInvalidとなり、DD-10.7前提（全preflightを状態変更前に完了）と設計§2.2「事前中断」に違反し、移動phase途中失敗のpartial_phase報告もされない。LayoutInvalidの判定自体（children marker不在・leaf数不一致・N_t=0）はlayout-generator.template-children-substitution・layout-planner.zero-slot-tab-template-invalidが管轄し、本条件は検証の発火時点が状態変更前であることを管轄する"
