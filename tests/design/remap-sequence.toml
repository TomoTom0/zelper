expect_return = "Err（ErrorClass=LayoutInvalid・messageにdefault_tab_template）。呼び出し記録に pipe・toggle-embed・rename-tab・go-to-tab・override-layout・focus-pane-id・new-tab がすべて0件で、companion setupも不発生（隔離XDG_CACHE_HOME配下にzelper/未作成）"

