[[condition]]
id = "remap-sequence.reconciliation-visual-order-tie-break-resolves-same-cwd-dups"
source_lines = "tests/fake_backend/remap.rs:2540"
target_function = "remap::run（reconciliation: bare dup対応づけのvisual order tie-break）"
source = "docs/design/detailed-design.md DD-10.7 step 6 照合不成立のreconciliation 3（TASK-81再E2E R1改訂・2026-09-20: 属性辺のみで完全マッチングが立たない曖昧構成では補助規則としてvisual order位置〔exited/held込みの順位 == slot s〕を属性辺と両立する〔全pairが補助辺を満たす〕マッチングへ絞り込むtie-breakとして使用し、残りがちょうど1通りなら採用。属性辺で完全マッチングが立たない系列は従来どおり追加辺として使用。tie-break後も一意でなければ安全側fallback）+ DD-10.13 reconciliation対応規則の既知限界（2026-09-20再E2E R1: 同一cwd shell slot複数+dupの曖昧構成〔t0p2 terminal_7・t0q2 terminal_14実測〕で追加辺では曖昧さが解消できずdup残留でexit 7となっていた系列を解消）+ DD-10.2 #14/#15"
description = "同一cwd shell slot複数+dupの曖昧構成でのtie-break（再E2E R1）: bare dup対応づけの属性照合（dup pane_cwd == 割当pane pane_cwd）で完全マッチングが複数通り立つ構成（同一cwdのshell slot 2つにdup 1件から属性辺が両方に立つ。u < shell割当数のため数整合の全対応shortcutも不適用）では、visual order補助辺（exited/held込みの順位 == slot s）と両立するマッチングのみ残すtie-breakで絞り込み、ちょうど1通りなら対応づけとして採用する（dup close→当該slotのpane cwd反転→pass 2）。実測ではdupはslot参照位置にspawnされるため補助辺の精度は十分。tie-break後も一意でなければ従来どおり安全側fallback（反転もcloseもせず検証失敗）。fail-first: 旧実装（補助辺を属性辺への追加辺として用いる）では属性辺の曖昧さが解消できず安全側fallback→dup残留で検証失敗になる系列"
given = "2-slot同一tab（shell slot 2つ: 割当shell pane 2つともpane_cwd=Some(同一値)・空slotなし。slot 0はNone系shellでpass 1照合成立・slot 1はRun::Cwd系shellで照合不成立）で、pass 1のbare slot spawn dup（pane_cwd=同一値注入〔/proc由来の現在cwd=クライアントcwdのemulation・fake拡張(iii)〕）が不成立slot参照位置に現れる系列でのrun（属性辺はdupから両shell slotに立ち完全マッチング2通り=曖昧）"
expect_return = "Ok（tie-breakで対応づけ成立: dup idへのclose-pane → 不成立slotのpane cwd反転 → pass 2のoverride-layoutで照合成立。pass 2後の当該slot位置（visual order）は割当shell pane id）。旧実装では安全側fallback（反転もcloseも不発）でVerificationFailedになる系列。source paneへのcloseは不発生"

