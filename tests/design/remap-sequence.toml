description = "--tab TABSPEC指定のscopeとanchor: TABSPEC（ID・一意名とも）はresolve_tabで解決し、sourceはそのtabのpaneのみ（他tabのpaneはsource外で移動もlayout適用もされず、当該tabはleftover_tabsとして報告）で、anchorもそのtabになる（group (0,0)の適用先go-to/override・最終go-to先が対象tabでありactive tabではない）。全sourceがanchor内となるためbreak-idは構造上不発で、k=1構成ではprobe・companionも不使用。scope判定はsource抽出とfloating抽出（--embed-floatingのtoggle対象・仮想embed組入れ予定の両集合）の双方に適用される: scope外tabのselectable floating terminal paneは通常実行のPreflight error（r8）対象外で、--embed-floating指定時もtoggleしない（floatingのまま元tabに残る。コードレビューminor-2）。TABSPEC不在/曖昧系の汎用解決はselector.toml既存条件（selector.tab-resolution-by-id-or-unique-name）の担当で本条件では重複検証しない（TASK-66/68先例と同じ判断。不在経路のNoTarget到達はtab-spec-unresolvable-is-no-targetが管轄）。本条件化は実装変更を伴わないためfail-firstでない（既存実装に対して緑）"
