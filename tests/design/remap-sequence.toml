[[condition]]
id = "remap-sequence.empty-list-panes-retry-in-polls"
source_lines = "tests/fake_backend/remap.rs:599"
target_function = "remap::run（poll closureのlenient化: probe poll・移動phase 5-a/5-b完了poll）"
source = "docs/design/remap-v2-matching-fix-task74.md §2.3（poll空応答のretry化。TR74-5: 副因Cの必須合格条件はfake backend test） + docs/design/detailed-design.md DD-10.7 空応答のlenient取得（poll対象では条件未成立としてpollingを継続。deadline 10s・C3規則は不変） + TASK-74段階8コードレビューCR74-2（probe pollのtitle判定をlenient呼び出しの戻り値で直接行い1回化。gate呼び出し+strict list_panes再取得の2重呼び出しでない）・CR74-3（空応答注入はrun冒頭snapshotで消費されないようpipe以降にarmする機構で行い、pollが実際に空を跨ぐ系列で検証）"
description = "poll中の空list-panes応答はretry（TASK-74副因C修正の核。CR74-2/3対応）: probe poll・移動phase 5-a/5-b完了poll内でlist-panes取得が空応答（exit 0・stdout空 → list_panes_lenientのOk(None)）を返えてもparse errorとして中断せず、条件未成立としてpollingを継続する。probe pollのtitle判定（zelper-probe-<nonce>出現）はlenient呼び出しの戻り値で直接行い、1 tickあたりbackend呼び出しは1回とする（lenientをgateのみに使い実際の判定をstrict list_panesで再取得するとtick毎2回spawnし、gate直後のstrict呼び出しが空応答を返した時点でfatalになる窓が残るため——CR74-2）。空応答の注入は、run冒頭のsnapshot取得（snapshot_lenient）で計数が消費されないよう最初のpipe以降にarmする機構（empty_panes_after_pipe等）で行い、probe poll・5-a/5-b完了pollが実際に空応答を跨ぐ系列で検証する（CR74-3: レビュー時点のfakeはempty_panes_before計数がrun冒頭snapshot_lenientで消費され切り、pollに空が届いていなかった。poll経路をstrictへ戻しても現testはpassするため未実証だった）。N回の空応答を跨いで成立したrunは移動・検証まで完了して成功する。fail-first: 現行実装（レビュー時点）はprobe pollのtitle判定がstrict list_panesのまま（空応答でfatal）。空応答がdeadline（10s）を超えて継続する場合は当該phaseのpolling timeout error（OperationFailed・文面にscreen繁忙の1s timeout機構への言及を含む）としてfatal"
given = "4 pane / 2 tab（k=2・移動あり）構成で、最初のpipe（probe）以降のlist_panes_lenient応答に先頭N回の空応答を注入（run冒頭snapshotは空を跨がないarm法）したrun"
expect_return = "Ok（全pane配置・検証pass。空応答を跨いでも中断していない）。probe pollは1 tickあたりlist-panes系backend呼び出し1回で、poll windowにstrict list_panes呼び出しを含まない"

[[condition]]
id = "remap-sequence.empty-response-retry-before-verify"
source_lines = "tests/fake_backend/remap.rs:639"
target_function = "remap::run（verify冒頭・snapshot取得のlenient化）"
source = "docs/design/remap-v2-matching-fix-task74.md §2.3（verify冒頭・run冒頭snapshot取得のlenient化。TR74-5） + docs/design/detailed-design.md DD-10.7 空応答のlenient取得（10.9検証冒頭の再取得・step 1 snapshotは取得できるまでdeadline内で再試行。fatal条件: 空応答のdeadline超過継続は当該phaseのpolling timeout errorへ合流） + TASK-74段階8コードレビューCR74-3（空応答注入はrun冒頭snapshotで消費されないようpipe以降にarmする機構で行い、検証冒頭が実際に空を跨ぐ系列で検証）"
description = "検証冒頭・snapshot取得の空応答retry: layout適用phase完了後の検証冒頭（10.9）のlist-panes/list-tabs再取得、step 6のfocus対象決定（E2E要因A改訂で追加された適用後のlist-panes取得）、およびrun冒頭のsnapshot取得（panes_now/tabs_now）は、空応答（Ok(None)）でも取得できるまでdeadline 10s内で再試行する。TASK-75（2026-09-16・E2E改修）: v2.2の呼び出し順では先頭N回空のarm法だとstep 6のfocus対象決定・存在確認pollが空を全数消化して検証冒頭に届かなくなるため、精密arm（empty_*_nth_after_override: 指定番目の呼び出しのみ空）で特定位置へ空を届ける——panes 1回目 = (0,0)のfocus対象決定・tabs 2回目 = 検証冒頭再取得、のそれぞれで空を跨いだ再試行を実証する。空がdeadlineを超えて継続する場合は、focus対象決定のpoll timeoutがwarning skip（best-effort）となったのち検証冒頭snapshotのtimeoutとしてOperationFailed（従来のpolling timeout errorへ合流）"
given = "4 pane / 2 tab（k=2）構成で、layout適用phase以降のlist-panes/list-tabs応答の指定番目（精密arm）に空応答を注入したrun（成立系: focus対象決定と検証冒頭のそれぞれで空を跨ぐ）と、空応答がdeadline超過まで継続する注入（fatal系）"
expect_return = "成立系はOk（検証pass）。fatal系はErr（ErrorClass=OperationFailed）"

