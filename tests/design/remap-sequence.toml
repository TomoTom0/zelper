[[condition]]
id = "remap-sequence.new-tab-only-needs-no-companion"
source_lines = "tests/fake_backend/remap.rs:1660"
target_function = "remap::run（空groupのみの実行・preflight depth）"
source = "docs/design/remap-v3-multi-tab-task75.md §3.4（空groupのみの実行〔M=0・またはsource全てanchor内で新規tabが空groupのみ〕のpreflight depth〔TR75-5〕: companion plugin・probe不使用〔break系pipe 0件〕。preflightは他caseと同一depth——layout解決・N_t=0検証〔LayoutInvalid〕・正規形化children置換検証〔LayoutInvalid〕・plan・生成KDL計算——を状態変更前に完了し、new-tab実行時点に未知の検証を残さない。new-tabの失敗〔非zero exit・stdout parse不能〕はOperationFailedで中断〔部分状態報告〕）・§3.4 move_needed判定（probe要否は「break系を使用するか」〔k > 1 または group(0,0) outbound非空〕に分離）・§3.4 E2E要因B改訂（空groupはnew-tab --layout-stringで作成時点で生成KDL適用・step 6のoverride-layoutはskip）・§2.4 E2E要因A改訂（focus-pane-idは全生成tabで実行） + docs/design/detailed-design.md DD-10.7 空groupのみの実行 v2.2・DD-10.6（M=0: k=1・全tab全slot空）"
description = "空groupのみの実行（TR75-5）: M=0（またはsource全てanchor内・新規tabが空groupのみ）のmulti-tab remapはbreak系pipe 0件で完了し、companion plugin・probe・permissions.kdl書換を一切行わない（move_neededとprobe要否の分離。r29参照）。preflightは状態変更前に他caseと同一depthで完了する（LayoutInvalid系はtemplate-invalid-detected-before-mutation）。anchor以外の生成tabはnew-tab --layout-string（生成KDL適用済みtab作成・E2E要因B改訂）→ rename → step 6（go-to → focus-pane-idのみ。override-layoutはskip）で具体化され、focus-pane-idは全生成tabで実行される（E2E要因A改訂: 位置ベース決定のためspawn paneも特定できる）"
given = "M=0（source空）でのT=3 multi-tab layout（N_t=9,1,2）のrun"
expect_return = "Ok。k=1・生成tab 3（(0,0)=anchor）。呼び出し記録にpipe・probeなし・permissions.kdl未作成（隔離XDG_CACHE_HOME配下にzellij/・zelper/未作成）で、new-tab --layout-string 2回・rename 2回・go-to 4回（step 6の3 tab分+最終go-to）・override-layout 1回（anchor (0,0)のみ。空groupは作成時点適用のためskip）・focus-pane-id 3回（全生成tab・位置ベース）"

