id = "remap-sequence.tab-id-resolution-lenient-before-apply"
source_lines = "tests/fake_backend/remap.rs:1721"
target_function = "remap::run（targets配列のdata flow・step 6直前のtab id存在確認・再解決）"
source = "docs/design/remap-v3-multi-tab-task75.md §3.4（targets配列のdata flow〔TR75-4〕: targets: Vec<TabId>〔長さk*T・targets[b*T+t]・block昇順tab昇順〕をexecute単一実行scope内で保持。DD-2「長寿命のtab id参照を持たない」原則の適用範囲は実行を超えた保持の禁止であり単一実行scope内の逐次参照は許容——この解釈をDD-10.7末尾へ明記。tab id再利用への実行内防御としてstep 6の各group処理直前にlist-tabs〔lenient〕でtargets[j]の存在確認を行い、不在なら再解決——割当ありgroupはpane所属基準〔5-b membership特定と同一〕・空groupはrename済み生成tab名基準〔list-tabsのname一致〕。go-to-tab-nameコマンドは同名tab曖昧性のため補助にしか使わない〔U75-7〕。new-tab由来idはstdout parse直後のrenameで「取得直後に消費」。再解決不能はOperationFailed〔中断時報告〕） + docs/design/detailed-design.md DD-10.7末尾 v2.2"
description = "tab idの実行内保持と再解決: targets[b*T+t]配列をexecute scope内で保持し、step 6の各group処理直前にlist-tabs（lenient・空応答は未成立として扱う）で存在確認する。tab idが再利用・消失等で不在の場合は再解決する（割当ありgroup: group全paneの所属tab特定〔selectable tiled terminal pane集合 == group〕・空group: rename済み生成tab名の一致）。再解決不能はOperationFailedで中断（部分状態報告）。CR75-1対応（2026-09-16コードレビュー）: 再解決時のlist_panes取得もlenient poll（一時的空stdoutで即時失敗しない。DD-10.7/10.9の空応答設計と同一規則。旧実装はstrict 1回呼び出しだった）"
given = "T=2 multi-tab layoutでのrun途中に、step 6開始前のある生成tabのidがlist-tabs上で別idに入れ替わる失敗注入をしたrun（再解決成立系: 同pane群が別idのtabに所属・空groupは生成tab名で特定）、入れ替わり＋再解決位置のlist_panes空応答注入（精密arm・CR75-1: retryで再解決成立）をしたrun、tab自体が消失し再解決不能になる失敗注入（fatal系）"
expect_return = "成立系はOkでgo-to-tab/override-layoutは再解決後のtab idへ向けられる。再解決時空応答系もOkで、再解決のlist-panes取得は空→retryの連続2回（strict 1回呼び出しでない）。fatal系はErr（ErrorClass=OperationFailed・中断時報告）"

