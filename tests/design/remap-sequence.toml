[[condition]]
id = "remap-sequence.reconciliation-early-return-ignores-earlier-groups"
source_lines = "tests/fake_backend/remap.rs:2709"
target_function = "remap::reconcile（pass 2なし系列の早期return判定）"
source = "TASK-81コードレビュー指摘C1（tm TASK-81 body: reconcile早期returnのclosed空判定がexecuteから渡された全group累積Vecであるため、k>=2で先行groupがclose済みだと後続groupの無害系列〔close対象なし・対応づけ不能なし〕が早期returnを抜け残余close経路の検証失敗note→exit 7に昇格しうる。誤closeはなし。判定を当該呼び出し内のclose実績〔command dup/bare dup close数のローカル計数〕へ変更） + docs/design/detailed-design.md DD-10.7 step 6 照合不成立のreconciliation（発動条件: 生きpane数>N_t、またはsnapshot非存在のexited/held pane存在のgate。正規spawn〔空slot由来〕のheld化との弁別は対応規則で行い、空slot相当の新規paneはclose対象外）"
description = "reconciliation早期returnの判定scope（コードレビューC1）: pass 2なし系列の早期returnは、当該reconcile呼び出し内で何もcloseしておらず（command dup/bare dup close数==0）対応づけ不能（ambiguity）もないなら、gate発動原因（held新規pane等）は正規spawn相当（空slot由来）の可能性があり対象外として観測をそのまま返す。判定は当該呼び出し内のclose実績（ローカル計数）で行い、closed_duplicates（executeから渡される全group累積Vec）の空判定にはよらない——先行groupのclose実績は本groupの判定に無関係であり、k>=2で先行groupがdup close済みでも後続groupの無害系列は早期returnして、残余close経路（close_budget==0でclose不発）の「reconciliation could not resolve duplicate panes ...」検証失敗note（exit 7）へ昇格しない。fail-first: 旧実装（累積closed空判定）では後続groupの無害系列が早期returnを抜けVerificationFailedになる"
given = "k=2構成（4 pane同一tab・3-slot layout）: 先行group (0,0)はpane 3をRun::Cwd系shellとしbare slot照合不成立→spawn dupのclose+反転（pass 2）で解消する系列（closed累積1件）。後続group (1,0)（pane 4 slot 0 + 空slot 2つ）の適用後に当該新規tabへ、どの割当argvとも一致しないcommand系のexited/held paneを1つ追加（fake拡張: spawn_held_extra_on_override。terminal_command=Someのためbare突合に掛からず、生きpane数==N_t==3のままgate〔F2条件: snapshot非存在のexited/held pane存在〕のみ発動するclose対象なしの無害系列）したrun"
