[[condition]]
id = "remap-sequence.tab-id-resolution-lenient-before-apply"
source_lines = "tests/fake_backend/remap.rs:1752"
target_function = "remap::run（targets配列のdata flow・step 6直前のtab id存在確認・再解決）"
source = "docs/design/remap-v3-multi-tab-task75.md §3.4（targets配列のdata flow〔TR75-4〕: targets: Vec<TabId>〔長さk*T・targets[b*T+t]・block昇順tab昇順〕をexecute単一実行scope内で保持。DD-2「長寿命のtab id参照を持たない」原則の適用範囲は実行を超えた保持の禁止であり単一実行scope内の逐次参照は許容——この解釈をDD-10.7末尾へ明記。tab id再利用への実行内防御としてstep 6の各group処理直前にlist-tabs〔lenient〕でtargets[j]の存在確認を行い、不在なら再解決——割当ありgroupはpane所属基準〔5-b membership特定と同一〕・空groupはrename済み生成tab名基準〔list-tabsのname一致〕。go-to-tab-nameコマンドは同名tab曖昧性のため補助にしか使わない〔U75-7〕。new-tab由来idはstdout parse直後のrenameで「取得直後に消費」。再解決不能はOperationFailed〔中断時報告〕） + docs/design/detailed-design.md DD-10.7末尾 v2.2"
description = "tab idの実行内保持と再解決: targets[b*T+t]配列をexecute scope内で保持し、step 6の各group処理直前にlist-tabs（lenient・空応答は未成立として扱う）で存在確認する。tab idが再利用・消失等で不在の場合は再解決する（割当ありgroup: group全paneの所属tab特定〔selectable tiled terminal pane集合 == group〕・空group: rename済み生成tab名の一致）。再解決不能はOperationFailedで中断（部分状態報告）。CR75-1対応（2026-09-16コードレビュー）: 再解決時のlist_panes取得もlenient poll（一時的空stdoutで即時失敗しない。DD-10.7/10.9の空応答設計と同一規則。旧実装はstrict 1回呼び出しだった）"
given = "T=2 multi-tab layoutでのrun途中に、step 6開始前のある生成tabのidがlist-tabs上で別idに入れ替わる失敗注入をしたrun（再解決成立系: 同pane群が別idのtabに所属・空groupは生成tab名で特定）、入れ替わり＋再解決位置のlist_panes空応答注入（精密arm・CR75-1: retryで再解決成立）をしたrun、tab自体が消失し再解決不能になる失敗注入（fatal系）"
expect_return = "成立系はOkでgo-to-tab/override-layoutは再解決後のtab idへ向けられる。再解決時空応答系もOkで、再解決のlist-panes取得は空→retryの連続2回（strict 1回呼び出しでない）。fatal系はErr（ErrorClass=OperationFailed・中断時報告）"

[[condition]]
id = "remap-sequence.stable-observation-gates-reconciliation"
source_lines = "tests/fake_backend/remap.rs:1868"
target_function = "remap::run（layout適用phase step 6・reconciliationの安定観測gate）"
source = "docs/design/detailed-design.md DD-10.7 step 6 照合不成立のreconciliation（TASK-81。2026-09-20 E2E改訂）: 各groupへのoverride-layout後に安定観測を行う——当該tabのselectable tiled terminal pane id集合（exited / is_heldのpaneを含む）がpolling（250ms間隔・10s deadlineは既存と同一）で2回連続で同一、かつ要素数 >= N_t（spawnは追加単調なため安定=反映完了。1回きりのlist-panesでは判定しない）。発動条件: 生きpane数（exited/held除く）> N_t、または生きpane数 == N_tでも当該tab内に実行開始前snapshot非存在のexited/held paneが存在する（短命command dupのheld化回収。正規spawn〔空slot由来〕のheld化との弁別は多段規則で行い空slot相当の新規paneはclose対象外））"
description = "reconciliationの安定観測gate（TASK-81。E2E改訂F2でgate拡張）: override-layout後の当該tabのterminal pane id集合（exited/held込み）が (1) pollingで2回連続同一 (2) 要素数 >= N_t の両方を満たした場合のみreconciliation（dup close・反転）へ進む。1回きりのlist-panes観測（未安定）では反転・closeを実行せずpollingを継続する（一時的な過剰状態で誤ってdup特定することの防御）。**発動条件の拡張（F2）**: 生きpane数 > N_t に加え、**生きpane数 == N_t でも当該tab内に実行開始前snapshot非存在のexited/held paneが存在するなら発動する**（held化dupが生きpane集合から外れて過剰検出から逃避するのを防ぐ。t0q qp8再現）。安定していてpane数 == N_t かつexited/held新規id paneが存在しない（過剰なし）ならreconciliationは不発動（focus-pane-idへ直行）。deadline超過は既存のpolling timeout経路"
given = "3 pane同一tab（shell pane 1割当構成・T=1・N=3）で、override-layout後のlist-panesが1回目と2回目でpane id集合が異なる系列（未安定→その後安定・過剰1）、安定して生きpane数==N_tの系列（過剰なし）、および生きpane数==N_tでも当該tabにspawn dupの即時held化（exited/held新規id pane）が存在する系列（gate拡張系列）でのrun"
expect_return = "未安定→安定系列は、id集合変化中のclose-pane・追加のoverride-layout（反転pass 2）不発生（安定確定後にreconciliation 1回のみ。改訂多段規則では追加paneにより超過数が不整合な本系列は対応づけ一意とならず安全側fallback——反転・closeとも不発で検証失敗note〔safe-side文面〕として報告。dry-runでないrunは最終的にOkか検証失敗のいずれか）。過剰なし系列はclose-pane不発生・override-layoutは当該group 1回のみで反転（2回目のoverride-layout）不発生。gate拡張系列はreconciliationが発動する（held新規id paneが対応規則の対象集合に入る。close/検証失敗の帰結はreconciliation-recovers-held-command-dupが管轄）"

[[condition]]
id = "remap-sequence.reconciliation-inverts-shell-slot-with-pane-cwd"
source_lines = "tests/fake_backend/remap.rs:1931"
target_function = "remap::run（reconciliation: 多段規則のbare dup対応づけ・dup close・pass 2）"
source = "docs/design/detailed-design.md DD-10.7 step 6 照合不成立のreconciliation（TASK-81。2026-09-20 E2E改訂: dup/slot対応付けを位置規則から多段規則〔属性・数突合中心〕へ全面置換。幾何前提の全廃）: 1. 自spawn候補=当該tab内のterminal pane全体（exited/held含む）かつ実行開始前snapshot非存在id。2. command dup: command slot割当ごとに候補中terminal_command==slot argv join(\" \")で逆引き→close（reason=command dup・位置不問）。3. bare dup: 候補中terminal_command=None群（D個）と空slot数（E個）の突合で超過分U=D-Eをdupとみなし、不成立shell slot（割当ありshell slotのうち割当paneのpane_cwdがSomeのもの）との対応を属性照合（dupのpane_cwd == 割当paneのpane_cwd）による対応候補と一意対応判定（完全マッチングがちょうど1通り）で特定。shell slot 1つのtabでは対応は一意。shell slot複数で属性のみ一意にならない場合のみ補助規則としてvisual order位置（exited/held込み順位==slot s）を一意性が得られる場合のみ使用し、失敗時は安全側fallback（反転もcloseもせず検証失敗）。4. 対応づいたbare dupをclose→対応shell slotをpane cwd=\"<当該割当paneのpane_cwd>\"へ反転→pass 2（高々1回・複数slot同時反転可・command dup closeと同一passに載せる））・DD-10.2 #14/#15 + docs/design/first/260821/requirements.md §2.6（L93限定条項）"
description = "shell slot反転のreconciliation系列（TASK-81 E2E改訂F1の核心: 位置規則→多段規則）: 安定観測後、自spawn候補（当該tab内terminal pane全体〔exited/held含む〕∧snapshot非存在id）から (1) command dupはargv一致逆引きでclose（位置不問）し、(2) bare dupはterminal_command=None群と空slot数の数突合（超過分U=D-E）で検出し、不成立shell slotとの対応を属性照合（pane_cwd一致）+一意対応判定で特定する（shell slot 1つなら一意。shell slot複数で属性のみ一意しない場合のみvisual order補助〔一意性が得られる場合のみ〕、失敗時は安全側fallbackで反転もcloseもせず検証失敗）。(3) 対応づいたbare dupをclose-paneし、(4) 対応shell slotのみpane cwd=\"<pane_cwd>\"（Run::Cwd表現）へ置き換えた生成KDLでoverride-layoutを再実行する（close単独で完了扱いにしない——closeだけではslot充填が起こらないためcloseは必ず再overrideとセット。反転は高々1回・複数slot同時反転可）。割当なしslot（空slot）の新規pane（正規spawn）はcloseしない。pass 2の生成KDLのslot表現はlayout-generator.run-cwd-representation-emits-cwd-only-pane。CLI new-tab由来shell（invoked_with=Run::Cwd）はpass 2で照合成立する"
given = "shell pane（terminal_command=None・pane_cwd=Some(\"/w\")）割当slot s と成立済みshell slot・空slotを含む構成で、pass 1のoverride-layout後にsnapshot非存在idのdup spawn（terminal_command=None）が現れ・pane数>N_t（またはheld化dup存在）で安定観測成立する系列でのrun（fakeのdefault modelではdupのpane_cwdがNoneのため属性照合の辺は張れず、visual order補助〔順位==slot・一意性成立〕で対応づく系列。押し出し割り込みで順位がずれる系列はreconciliation-inverts-despite-order-displacementが管轄）"
expect_return = "Ok（pass 2で照合成立）。呼び出し列にclose-pane <dup id> → 2回目のoverride-layout（pass 2。slot sがpane cwd=\"/w\"の生成KDL）の順が現れ、pass 2後の当該位置は割当shell pane id。成立済みslot位置のpaneはcloseも反転もされず、空slot由来の新規pane（正規spawn）はcloseされない"

[[condition]]
id = "remap-sequence.command-slot-dup-closed-without-inversion"
source_lines = "tests/fake_backend/remap.rs:1995"
target_function = "remap::run（reconciliation: command dupのargv一致逆引きclose・反転不能経路）"
source = "docs/design/detailed-design.md DD-10.7 step 6 照合不成立のreconciliation 2（command dup: argv一致逆引き・位置不問。E2E改訂F1）（TASK-81: command slot割当（run=Some）ごとに、候補中のterminal_command == 当該slot argv join(\" \")であるpaneを逆引きしてcloseする〔reason=command dup・位置不問〕。押し出し介在やheld化の影響を受けない属性一致特定であり、command dupはcwd反転の対象表現を持たないためcloseのみとし検証失敗経路へ合流する）・DD-10.2 #15"
description = "command slot由来dupの取り扱い（TASK-81。E2E改訂F1: 位置不問のargv一致特定へ）: command slot割当（run=Some）ごとに、自spawn候補（当該tab内terminal pane全体〔exited/held含む〕∧snapshot非存在id）の中からterminal_commandが当該slotのrun argv join(\" \")と一致するpaneを**位置によらず属性一致で逆引き**してcloseする（reason=command dup）。押し出しpaneの介在でdupのvisual order順位がslot位置と異なっていても特定できる（幾何前提の全廃）。command dupはcwd反転の対象表現を持たないため（Run::Commandはargv+cwdで既に注入済み）、closeのみ実施して検証失敗経路へ合流する（pass 2の再overrideで照合成立しない）。close実績はclosed_duplicatesへ報告"
given = "command pane（terminal_command=Some(\"htop\")・pane_cwd=Some(\"/w\")）割当slotで、pass 1のoverride-layout後に当該runとargv一致の新規spawn pane（snapshot非存在id・cwd差により照合不成立）が過剰として残る系列でのrun"
