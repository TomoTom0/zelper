source = "docs/design/remap-v3-multi-tab-task75.md §2.8（pane name属性→pane titleは保証外・観察のみ）・§8（tab位置〔position〕の並替再現。anchorの位置はlayout最初のtab位置と一致する保証はない〔anchor再利用・D1の帰結〕） + docs/design/detailed-design.md DD-10.13 multi-tab再現の対象外 (1)(4) + requirements.md §2.6例外(a)(c)"
