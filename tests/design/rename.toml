description = "rc=0黙失敗のpostcondition検出（tab版）: rename_tab呼出がOkでもtabs状態のnameが書き換わらない系列は、事後list_tabsのpostcondition検証でVerificationFailed（exit 7）として報告する。pane側同名条件がFakeBackend必ずtitle反映のため黙失敗系列を注入できない（検証限界——L4実zellij扱い）のに対し、tab側はmute_rename_tab注入（C5機構）で黙失敗系列が再現可能なため実挙動（class・exit・文面・呼出列）を検証する。postconditionは t.id == tid && t.name == name の両照合（DD-8「対象のname反映」）であり、別IDのtabが既に新名を保有する構成（case b）でname照合のみへ弱めた実装（ID照合欠落）を検出する"
given = "mute_rename_tab()（rename_tab呼出はOkだがnameを書き換えない——rc=0黙失敗模擬）を注入したrename::run_tab(b, 0, new, false)。構成は (a) tabs=[{id:0, name=tab0}]のみ（変更先名を持つtabが存在しない） (b) tabs=[{id:0, name=tab0}, {id:1, name=new}]（別IDのtabが既に新名を保有。対象tab0のnameはmuteで不変）"
expect_return = "いずれの構成もErr（class=VerificationFailed・exit 7）。messageはrename of tab 0 did not take effectの完全一致。callsは list-tabs → rename-tab 0 new → list-tabs（呼出自体はrc=0成功扱いで発行済み）"

[[condition]]
id = "rename.tab-success-argv-and-report"
source_lines = "tests/cli/list_read_send.rs:3957"
target_function = "ZellijBackend::rename_tab → rename::run_tab（TABSPEC解決+実行+報告）"
source = "docs/design/detailed-design.md DD-8（plan: rename-tab-by-id <id> <name>・postcondition: list-tabsでname反映確認・検証失敗はVerificationFailed exit 7）+ DD-1.3（TABSPEC = tab IDまたは一意なtab名——全verb共通解決）+ docs/testing/test-plan.md §2.5（pane/tab rename呼び出しとpostcondition検証）"
description = "rename tab成功経路のTABSPEC解決とargv・報告契約: TABSPEC一意名はresolve_tabでTabIdへ解決され（全verb共通解決のverb経由確認——L2成功条件のID/一意名両case直呼びと対）、実行は `--session <sess> action rename-tab-by-id <id> <name>` 1回、postcondition（list-tabs再取得でname反映）通過後にhuman 1行 / JSON envelope（renamed_tab=id・name=新名。paneのrenamed・sessionのrenamed_session流儀の継承）で報告する。cli-grammar.rename-parse-emits-typed-argv（ID指定・human報告・argv形式）と分担: 本条件は一意名解決込み系列とJSON envelopeを担う"
given = "fake zellij shim（FAKE_TABS_JSONにname=mytabのtab〔tab_id=0〕1件。rename-tab-by-id応答はtabs状態fileのname書換——TASK-65機構）に対する zelper rename tab mytab newtab のhuman/JSON各実行"
expect_return = "いずれもexit 0。FAKE_LOGに `--session fake-sess action rename-tab-by-id 0 newtab` がちょうど1回。humanは `renamed tab 0 -> newtab` 1行。JSONはdata.renamed_tab=0（数値）・data.name=newtab"

