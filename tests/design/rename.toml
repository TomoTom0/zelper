[[condition]]
id = "rename.session-missing-name-notarget-with-candidates"
source_lines = "tests/cli/list_read_send.rs:3692, tests/fake_backend/rename_add_remove.rs:689"
target_function = "rename::run_session（事前存在確認: list_sessions EXITED込み）"
source = "tmp/tasks/tm-95/design_rename-session.md §2.1（旧NAME事前存在確認はlist_sessions〔EXITED込み〕。不在はNoTarget・candidates=全行のname〔EXITED込み〕・行0件は「no zellij sessions found」文面——remove sessionのremove::session_not_foundと同一基準・同一文面群。単一対象のため不在文面は単数形 session 'NAME' not found）・§2.6表・§2.8（実行順序: 不在判定はEXITED判定・NEW_NAME衝突判定に優先。複合違反入力での優先順位固定はL2の優先順位test〔本条件とexited条件の2条件のtagを持つ〕が担う）"
description = "旧NAME不在の分類: NAMEがlist_sessionsの行（RUNNING・EXITEDとも）に存在しない場合はNoTarget（exit 3）で中断し、candidatesには全行のname（EXITED行も含む）を出す（remove sessionと同一基準。agentの修正導線が同じになる）。一覧が完全0件（0-session環境）の場合は候補列出力ではなく「no zellij sessions found」の文面でNoTargetになる。いずれもrename呼出は不発（fail-fast）。不在判定はNEW_NAME衝突判定より優先する（§2.8順序3が順序5に先行——不在NAME×NEW_NAME衝突の複合違反では衝突でなくNoTarget）"
given = "fake zellij shimに対する zelper rename session NAME NEW_NAME --json の各構成: (i) FAKE_SESSIONS=稼働1件+EXITED行1件の環境で行に存在しないNAME（ghost）を指定 (ii) FAKE_SESSIONS_EMPTY=1（0-session環境）でNAMEを指定（複合違反: 不在NAME（ghost）×NEW_NAME=既存running名（taken）の構成はL2 run_session直呼びでNoTarget優先・文面・candidates完全一致を検証）"
expect_return = "(i) exit 3（NoTarget）。error.candidatesは全行名の完全一致（稼働名+EXITED名・行順）。messageは session 'ghost' not found の完全一致。(ii) exit 3（NoTarget）。messageはno zellij sessions foundの完全一致。いずれもFAKE_LOGにrename-session呼出なし・共通解離文面（no running zellij session found）を含まない"

[[condition]]
id = "rename.session-new-name-collision-preflight"
source_lines = "tests/cli/list_read_send.rs:3754"
target_function = "rename::run_session（NEW_NAME衝突事前検査: EXITED込み）"
source = "tmp/tasks/tm-95/design_rename-session.md §2.2（事前list_sessions一覧でNEW_NAMEと同名の行〔EXITED行を含む〕が存在すればPreflight exit 7でfail-fast拒否。文面はadd sessionと同一形式 session already exists: 'NEW_NAME'。衝突黙失敗〔M4 I: rc=0・旧名消失・既存名のみ残存〕がwrap側の事前検査なしには検出不能であることが根拠。EXITED込みはEXITED名へのrename挙動が未測定のため安全側）・§2.6表"
description = "NEW_NAME衝突の事前fail-fast: NEW_NAMEが既存行（running・EXITEDの両方）と同名の場合はPreflight（exit 7）で状態変更前に拒否する。zellijは既存名へのrenameをrc=0・両stream空の黙って失敗として受け入れる（M4 I実測）ため、事前検査が唯一の防衛。文面はadd sessionと同一の session already exists 形式"
given = "fake zellij shim（FAKE_SESSIONS=old稼働 + taken稼働 + deadname EXITED行）に対する zelper rename session の各構成: (i) old → taken（running行と衝突） (ii) old → deadname（EXITED行と衝突）"
expect_return = "いずれもexit 7（Preflight）。messageは session already exists: 'taken' / 'deadname' の形。FAKE_LOGにrename-session呼出なし（fail-fast）"

