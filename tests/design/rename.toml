source_hash = "d619aef93177608af3c620e7ed5391d938fe4e8d"
note = "TASK-95実装工程で全条件緑化・検証記録を再設定（設計: tmp/tasks/tm-95/design_rename-session.md。session条件はテスト先行作成〔fail-first確認済み〕→実装で緑化）。コードレビュー（codex_review_impl.log・rework-needed）5指摘への対応: 空白含みNEW_NAMEの受理からUsage事前拒否への設計変更〔blocker-1。parse_sessionsがlist-sessions行の先頭wordのみを名前化するため世界modelで復元不能・postcondition必敗。旧条件rename.session-whitespace-name-acceptedは意味反転のため新id rename.session-whitespace-name-rejectedへ差し替え〕・postcondition各判定の独立保護条件追加〔warn-2。fake.rsのrename_post_inject注入〕・assert強化〔warn-3。成功系呼出列完全一致・複合違反入力での検査優先順位固定（不在/EXITEDがNEW_NAME衝突に優先）・不在/衝突/同一名/不正新名/EXITED各文面とcandidatesの完全一致化〕・exited条件のgiven誤記修正〔note-4〕。run_sessionの実行順序は設計§2.8: app層Usage検査（空文字/'/'含み/空白含み/同一名）→事前list_sessions 1回（不在NoTarget/EXITED旧名/NEW_NAME衝突の全判定に共用）→rename呼出→事後list_sessions postcondition（旧名消失+新名running出現）→報告。src/zellij/process.rs（rename_session trait実装。trait定義はsrc/zellij/mod.rs）・src/cli.rs（RenameTarget::Session）・src/main.rs（RenameTarget::Session例外dispatch・probe backend）も検証対象。CLI parse文法・help出現はcli-grammar.tomlが分担（DD-1.6へ追加したsession例のparse表面はrename.session-success-argv-and-reportが検証——cli-grammar.toml同条件のdescriptionに分担記載）。TASK-97テスト先行（実装前fail-first）: rename session NEW_NAME先頭`-`検査追加（設計: tmp/tasks/tm-97/design_rename-leading-dash.md §2.1-§2.3・§2.5）——条件5（invalid-new-name-usage-error・id不変）へ`--`経由の先頭`-`案を4案目として追加（JSON検証は--jsonを--より前に置く形式）し、L2新条件rename.session-leading-dash-new-name-rejected（検査順固定: 先頭`-`は'/'・whitespace後・同一名differ前。旧NAME=\"-x\"一覧存在時のbackend到達契約保護〔旧NAMEは文字種検査対象外〕）を追加。実装前のため追加case・条件は赤（fail-first確認: tmp/tasks/tm-97/test_red_l3.log・test_red_l2.log）→実装工程（2026-11-14）でrun_session冒頭へ先頭`-`検査（starts_with('-')・Usage exit 2・文面NEW_NAME must not start with '-'・検査順 empty → '/' → whitespace → 先頭`-` → 同一名differ・旧NAMEは文字種検査対象外）を追加し全条件緑化・検証記録を再設定（緑化: tmp/tasks/tm-97/test_green.log。test_commandはrename系絞り込み実行——全件cargo testは指揮役verifyで実施）。src/cli.rs（RenameTarget::Session doc commentのNEW_NAME/旧NAME非対称な先頭`-`扱いの検証仕様追記）も検証対象。TASK-66: excluded 4件目（rename tab未test）をL2 2条件（成功系〔TABSPEC=ID/一意名〕・mute_rename_tab注入による黙失敗postcondition検出）+L3 1条件（TABSPEC一意名解決込み成功・JSON envelope。ID指定・human・argv形式はcli-grammar.rename-parse-emits-typed-argv〔TASK-65〕が検証済みのため分担）へ条件化。TABSPEC不在/曖昧系とbackend呼出失敗系はapp層独自分岐なし・既存条件（selector.tab-resolution-by-id-or-unique-name・pane側backend-failure条件）と重複するため除外記録へ。本条件化は実装変更を伴わないため追加testはfail-firstでなく既存実装に対して緑であることを確認（tmp/tasks/tm-66/test_green_l2.log・test_green_l3.log・verify_conditions.log）"

