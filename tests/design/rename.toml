# rename操作（src/app/rename.rs）の検証条件。pane分の出典: test-plan §2.5・§2.9・DD-8・requirements §2.4
# 対応test（原則1条件=1 test fn。設計書§2.3/3.4。例外1件: session L2の優先順位test
#   〔rename_session_check_order_missing_and_exited_before_collision〕は不在・EXITED
#   両条件の複合違反caseとして2条件のtagを持つ）:
#   pane 3条件 = tests/fake_backend/rename_add_remove.rs
#   tab 3条件（TASK-66でexcluded 4件目を条件化。TABSPEC不在/曖昧系とbackend呼出
#     失敗系はselector.toml・pane側既存条件が担うため除外記録へ）:
#     L2 2条件 = tests/fake_backend/rename_add_remove.rs（成功系〔TABSPEC=ID/一意名〕・
#       mute_rename_tab注入による黙失敗postcondition検出）
#     L3 1条件 = tests/cli/list_read_send.rs（TABSPEC一意名解決込み成功・JSON envelope。
#       ID指定・human報告・argv形式はcli-grammar.rename-parse-emits-typed-argvが検証済み）
#   session 14条件（TASK-95テスト先行作成・実装前fail-first。コードレビュー対応で
#     whitespace条件を受理からUsage事前拒否へ反転〔blocker-1〕しpostcondition
#     独立保護条件を追加〔warn-2〕。TASK-97テスト先行: 条件5へ先頭`-`（`--`経由）案を
#     4案目に追加しL2新条件1件〔NEW_NAME先頭`-`検査〕を追加）:
#     L2 7条件 = tests/fake_backend/rename_add_remove.rs（状態書き換え・mute黙失敗検出・
#       呼出失敗・事後list失敗class保持・空白含み名拒否・先頭`-`新名拒否〔TASK-97〕・
#       postcondition両判定の独立保護）
#     L3 7条件 = tests/cli/list_read_send.rs（成功argv/報告・不在candidates・衝突・
#       同一名・不正新名〔TASK-97で先頭`-`（`--`経由）案追加〕・EXITED拒否・probe dispatch。shimのFAKE_SESSIONS〔EXITED行混在可〕・
#       FAKE_SESSIONS_EMPTY・${FAKE_LOG}.renamed〔rename-session作用のlist-sessions応答反映〕）
# 層帰属（TASK-95設計§2.10: remove-session.toml先例に倣う）: parse文法・help出現・exit code
#   実出力・文面・FAKE_LOG argv列・envelope実出力・0-session/probe dispatchはL3。
#   app層class mapping・FakeBackend状態遷移・呼出契約・mute/fail注入による検出はL2
