given = "FakeBackend（sessionsにold稼働）へinject_rename_post注入（3系列それぞれ）したrename::run_session(b, old, new, false)"
expect_return = "いずれの系列もErr（class=VerificationFailed・exit 7）。呼出列はlist-sessions → rename-session@old new → list-sessions（呼出自体はrc=0成功扱いで発行済み・状態作用のみ注入で差し替え）"

