source = "tmp/tasks/tm-95/design_rename-session.md §2.5（postconditionは (1) 旧NAME行の消失〔RUNNING/EXITED問わず〕 (2) NEW_NAME行が存在しexited == false の両方を確認。不成立はVerificationFailed exit 7。衝突黙失敗〔M4 I〕は「旧名消失・新名不出現」・no-op黙失敗〔M95-B/C1〕は「旧名残存・新名不出現」など失敗の現れ方が複数あるため両条件必須）・§4軸B・TASK-95コードレビュー指摘2（mute注入では旧名残存・新名不在が同時に成立するため各判定の弱体化を検出できない——独立保護testが必要）"
