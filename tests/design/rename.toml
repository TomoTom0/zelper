source_lines = "tests/fake_backend/rename_add_remove.rs:739"
target_function = "rename::run_session（app層冒頭のNEW_NAME validation: 先頭`-`）"
source = "tmp/tasks/tm-97/design_rename-leading-dash.md §2.1（NEW_NAME検査へ先頭`-`を4種目として追加。`--`option終端経由の通過系列が`--`挿入なしの zellij --session <from> action rename-session <to> 組み立て〔src/zellij/process.rs rename_session〕へ到達するためzeller側clap依存の拒否が成立せず、有効option一致値〔-c等〕の下流挙動は未測定・zellij側option集合はzeller管理外のためzellij委ねでは契約保証不能——下流のoption解釈（zellij有効option一致値・将来版option集合）に依存せずNEW_NAMEを確定拒否。add session NAME検査〔TASK-96〕と対称）・§2.2（検査順 empty → '/' → whitespace → 先頭`-` → 同一名differ。先頭`-`は同一名differの前——文字種4種〔形式検査〕が関係検査〔differ〕に先行。文面NEW_NAME must not start with '-'）・§2.3（旧NAMEへの文字種Usage検査は追加しない——世界model〔一覧行〕にある名前は文字種にかかわらずrename対象とする既存契約を変えない。一覧存在時のbackend到達は既存契約の帰結）・§2.5 L2新条件欄"
description = "先頭`-`NEW_NAMEのUsage事前拒否と検査順・旧NAME非検査の契約保護（L2）: 先頭`-`NEW_NAMEはUsage（exit 2）で一覧取得より前に拒否する（run_session直呼びのためclapを経由しない系列〔先頭`-`直値〕で検証）。あわせて (a) 先頭`-`×同一名の複合違反では先頭`-`優先（differ文面でない——§2.2の挿入位置保護） (b) 先頭`-`×'/'・先頭`-`×空白の複合違反では既存文字種優先（先頭`-`検査を'/'やwhitespaceより前に誤挿入する実装の検出——本taskが定める順序の固定。add側L2条件〔TASK-96〕はdifferを持たずrename側の挿入位置を保護しないためrename側で保護する） (c) 旧NAME=\"-x\"（一覧に行が存在しrunning）はUsage拒否されずbackend呼出へ到達（§2.3決定の契約保護——対称性から旧NAMEへもstarts_with('-')を誤追加する実装の検出）を担う。L3 shim条件（invalid-new-name-usage-errorの先頭`-`案）と対をなすL2側の検証"
given = "FakeBackend（sessionsにs0〔exited=false〕）に対するrename::run_session(b, NAME, NEW_NAME, false)の各構成: (i) s0 → -x（先頭`-`単独） (ii) -x → -x（先頭`-`×同一名の複合違反） (iii) s0 → -a/b（'/'複合）と s0 → -a b（空白複合） (iv) sessionsに-x〔exited=false〕を置いた -x → new（旧NAME先頭`-`・一覧存在）"
expect_return = "(i)(ii)(iii) いずれもErr（class=Usage・exit 2）。messageは (i)(ii) NEW_NAME must not start with '-'・(iii) NEW_NAME must not contain '/' / NEW_NAME must not contain whitespace の完全一致。calls空（list-sessions・rename-sessionとも不発——一覧取得より前のfail-fast）。(iv)はOk。callsは list-sessions → rename-session@-x new → list-sessions の完全一致（旧NAME=\"-x\"はUsage拒否されずbackend到達）"

